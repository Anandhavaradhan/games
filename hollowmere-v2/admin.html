<!doctype html>
<!--
  HOLLOWMERE — KEEPER'S LEDGER (admin dashboard)
  Open it at  https://<you>.github.io/<repo>/admin.html
  Only accounts listed in the Firestore collection "admins" can see any data;
  everyone else gets instructions instead (firestore.rules enforces this, not the page).
  Shows: headline figures, who is in the house right now (live clocks),
  the leaderboard (with remove / block), character combinations, every player, and each player's run history.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hollowmere · Keeper's ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#07080d; --crypt:#0f1119; --crypt2:#141722; --line:#252836;
    --bone:#ddd5c0; --ash:#8c8573; --dim:#5d6072;
    --ember:#ffb85c; --veil:#9fc4ff; --blood:#e0563f;
    --data:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --serif:'IM Fell English',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--night);color:var(--bone);font-family:var(--data);font-size:14px;line-height:1.45}
  body{min-height:100vh;background:radial-gradient(ellipse at 20% -10%,rgba(255,140,50,.07),transparent 50%),var(--night)}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--veil);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums}
  /* ---- leaderboard section ---- */
  .board{list-style:none;border:1px solid var(--line);border-radius:4px;overflow-x:auto}
  .board li{display:grid;grid-template-columns:32px minmax(130px,1.3fr) minmax(120px,1fr) 80px 90px 100px auto;
    align-items:center;gap:14px;padding:9px 14px;border-top:1px solid var(--line);min-width:760px}
  .board li:first-child{border-top:0}
  .board .bk{color:var(--dim);text-align:right}
  .board li.top .bk{color:var(--ember)}
  .board .bname{background:none;border:0;text-align:left;cursor:pointer;color:var(--bone);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board .bname:hover{color:var(--ember)}
  .board .bleg,.board .bd,.board .bw{color:var(--ash);font-size:13px;white-space:nowrap}
  .board .bleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
  .board .bt{color:var(--ember);font-size:16px;text-align:right}
  .board .bx{display:flex;gap:6px;justify-content:flex-end}
  .mini{border:1px solid var(--line);background:var(--crypt2);padding:4px 9px;font-size:12px;border-radius:3px;cursor:pointer;color:var(--ash)}
  .mini:hover{border-color:#4a4d60;color:var(--bone)}
  .mini.warn:hover{border-color:var(--blood);color:var(--blood)}

  header.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:22px clamp(16px,4vw,40px) 18px;border-bottom:1px solid var(--line)}
  .mark{font-family:'Cinzel Decorative',Georgia,serif;font-weight:700;font-size:22px;letter-spacing:.12em;color:var(--bone)}
  .sub{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ash)}
  .who{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--ash);font-size:13px}
  .btn{border:1px solid var(--line);background:var(--crypt2);padding:8px 14px;cursor:pointer;border-radius:3px}
  .btn:hover{border-color:#4a4d60}
  .btn.primary{border-color:#6b5534;background:#221a10;color:var(--ember)}
  .btn.primary:hover{border-color:var(--ember)}

  main{padding:24px clamp(16px,4vw,40px) 60px;max-width:1400px}
  .state{max-width:520px;margin:10vh auto;text-align:left}
  .state h2{font-family:var(--serif);font-weight:normal;font-size:28px;margin-bottom:10px}
  .state p{color:var(--ash);margin-top:8px}
  .state code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--crypt2);padding:2px 6px;border-radius:3px;color:var(--bone);word-break:break-all}
  .state .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .field{display:block;width:100%;margin-top:10px;padding:10px 12px;background:var(--crypt);border:1px solid var(--line);border-radius:3px}
  .err{color:var(--blood);margin-top:10px;min-height:20px}

  .summary{display:flex;flex-wrap:wrap;gap:28px 44px;padding-bottom:22px;border-bottom:1px solid var(--line)}
  .fig b{display:block;font-size:26px;font-weight:500;letter-spacing:-.01em}
  .fig span{color:var(--ash);font-size:13px}
  .fig.hot b{color:var(--ember)}

  h3{font-family:var(--serif);font-weight:normal;font-style:italic;font-size:21px;color:var(--bone);margin:30px 0 14px;display:flex;align-items:baseline;gap:10px}
  h3 small{font-family:var(--data);font-style:normal;font-size:13px;color:var(--dim)}

  /* ---- the one loud thing: who is in the house right now ---- */
  .live{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .lcard{position:relative;padding:16px 18px 14px;background:linear-gradient(160deg,#1b1510,#0f1119 70%);border:1px solid #3d2f1e;border-radius:4px;cursor:pointer;text-align:left;overflow:hidden}
  .lcard::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--tint,var(--ember))}
  .lcard.hunted{border-color:#5a2419;background:linear-gradient(160deg,#241010,#0f1119 70%)}
  .lcard .nm{font-size:16px;font-weight:600}
  .lcard .st{color:var(--ash);font-size:13px;margin-top:2px}
  .lcard.hunted .st{color:var(--blood)}
  .clock{font-family:var(--serif);font-size:38px;line-height:1;margin-top:12px;color:var(--ember);text-shadow:0 0 22px rgba(255,160,60,.35)}
  .lcard.hunted .clock{color:#ff7a5e;text-shadow:0 0 22px rgba(255,60,30,.4)}
  .diamonds{margin-top:10px;letter-spacing:4px;font-size:13px;color:#3a3630}
  .diamonds i{font-style:normal;color:var(--ember)}
  .lmeta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ash)}
  .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ember);margin-right:7px;box-shadow:0 0 0 0 rgba(255,184,92,.6);animation:beat 1.8s infinite}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(255,184,92,.55)}70%{box-shadow:0 0 0 9px rgba(255,184,92,0)}100%{box-shadow:0 0 0 0 rgba(255,184,92,0)}}
  .empty{color:var(--dim);font-style:italic;font-family:var(--serif);font-size:16px}

  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .tools input{width:min(320px,100%);padding:9px 12px;background:var(--crypt);border:1px solid var(--line);border-radius:3px}
  .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
  table{border-collapse:collapse;width:100%;min-width:980px}
  th{position:sticky;top:0;background:var(--crypt2);text-align:left;font-weight:500;font-size:12px;color:var(--ash);padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
  th[aria-sort] {color:var(--bone)}
  th .ar{color:var(--ember);margin-left:4px}
  td{padding:10px 12px;border-bottom:1px solid #1a1c27;white-space:nowrap;font-variant-numeric:tabular-nums}
  tbody tr{cursor:pointer}
  tbody tr:hover,tbody tr:focus-visible{background:#131623;outline:none}
  td.r,th.r{text-align:right}
  .pname{font-weight:600}
  .pmail{color:var(--dim);font-size:12px}
  .chip{display:inline-flex;align-items:center;font-size:12px;color:var(--ash)}
  .chip.on{color:var(--ember)}
  .chip.hunt{color:var(--blood)}
  .chip.on::before,.chip.hunt::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px}
  .ether{color:var(--ember)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}

  /* ---- drawer ---- */
  #drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--crypt);border-left:1px solid var(--line);overflow-y:auto;z-index:10;padding:22px 24px 40px;box-shadow:-30px 0 60px rgba(0,0,0,.5)}
  #drawer[hidden]{display:none}
  #scrim{position:fixed;inset:0;background:rgba(3,4,8,.55);z-index:9}
  #scrim[hidden]{display:none}
  .dhead{display:flex;align-items:flex-start;gap:12px}
  .dhead h2{font-family:var(--serif);font-weight:normal;font-size:30px;line-height:1.1}
  .dhead .x{margin-left:auto}
  .dsub{color:var(--ash);margin-top:4px}
  .grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;margin-top:18px}
  .grid2 div span{display:block;color:var(--ash);font-size:12px}
  .grid2 div b{font-size:18px;font-weight:500;white-space:nowrap}
  .legends{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
  .lg{position:relative;padding:7px 8px 6px;border:1px solid #1d2030;border-radius:3px;font-size:12px;color:var(--dim);background:#0b0d14}
  .lg.own{color:var(--bone);border-color:#2c3042;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%)}
  .lg.bound{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
  .lg small{display:block;font-size:11px;color:var(--dim)}
  .tier{color:var(--ash);font-size:12px;margin:12px 0 6px}
  .runs{list-style:none}
  .runs li{display:grid;grid-template-columns:86px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid #1a1c27;align-items:baseline}
  .runs .res{font-weight:600}
  .runs .res.escape{color:#9fe0b4}
  .runs .res.death{color:var(--blood)}
  .runs .meta{color:var(--ash);font-size:12px}
  .bar{height:6px;background:#1a1c27;border-radius:3px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--c,var(--veil))}
  .uses{display:grid;grid-template-columns:130px 1fr 36px;gap:4px 10px;align-items:center;font-size:12px}

  /* ---- character combinations (combined legends) ---- */
  .combos{list-style:none;border:1px solid var(--line);border-radius:4px}
  .combos li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:9px 14px;border-top:1px solid var(--line)}
  .combos li:first-child{border-top:0}
  .combos .cwho{background:none;border:0;cursor:pointer;color:var(--bone);font-weight:500;min-width:120px;text-align:left}
  .combos .cwho:hover{color:var(--ember)}
  .combos .cparts{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:200px}
  .combos .cmeta{color:var(--ash);font-size:12px;white-space:nowrap}
  .cpart{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid #2c3042;border-radius:10px;font-size:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 18%,transparent),transparent 80%)}
  .cpart.gone{border-color:var(--blood);color:var(--blood)}
  .cpart.pick{cursor:pointer;color:var(--dim);background:#0b0d14}
  .cpart.pick.on{color:var(--bone);border-color:var(--c)}
  .cpart.pick b{color:var(--ember)}

  /* ---- keeper's edits: only visible while the drawer is in edit mode ---- */
  .lg.can{cursor:pointer}
  .lg.can:hover{border-color:var(--c);color:var(--bone)}
  .lg.can::after{content:'+';position:absolute;top:4px;right:7px;color:var(--dim);font-size:13px;line-height:1}
  .lg.can.own::after{content:'\2212'}
  .lg.can:hover::after{color:var(--bone)}
  .edits{margin-top:18px;padding:14px 16px;border:1px solid #3b3450;border-radius:4px;background:#0c0d16}
  .edits h4{font-family:var(--serif);font-style:italic;font-weight:normal;font-size:18px}
  .edits .hint{color:var(--dim);font-size:12px;margin:2px 0 12px}
  .frm{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px 14px}
  .frm label{display:block;color:var(--ash);font-size:12px;margin-bottom:3px}
  .frm input,.frm select{width:100%;padding:6px 9px;background:var(--crypt2);border:1px solid var(--line);
    border-radius:3px;font-variant-numeric:tabular-nums}
  .editbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 2px}
  .saved{color:#9fe0b4;font-size:12px}
  .danger{margin-top:16px;padding-top:13px;border-top:1px solid #2b1c1a}
  .btn.bad{border-color:#5a2a22;color:var(--blood)}
  .btn.bad:hover{border-color:var(--blood);background:#1c100e}
  .dhead #dedit{margin-left:auto}
  .dhead #dedit + .x{margin-left:8px}
  .runs li.ed{grid-template-columns:86px 1fr auto auto}
  .rx{border:0;background:none;color:var(--dim);cursor:pointer;font-size:17px;line-height:1;padding:0 2px 0 8px}
  .rx:hover{color:var(--blood)}

  @media (max-width:640px){
    .who{margin-left:0;width:100%}
    .grid2{grid-template-columns:repeat(2,1fr)}
    .clock{font-size:32px}
  }
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="mark">Hollowmere</div>
  <div class="sub">Keeper's ledger</div>
  <div class="who" id="who"></div>
</header>
<main id="app"><div class="state"><p>Opening the ledger…</p></div></main>
<div id="scrim" hidden></div>
<aside id="drawer" hidden aria-label="Player record"></aside>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
const SDK='https://www.gstatic.com/firebasejs/12.19.0/';
const ROSTER=[["gunslinger","GUNSLINGER",2,"#ffb45e","CONTROL"],["knight","KNIGHT",2,"#bfd4e6","ESCAPE"],["samurai","SAMURAI",4,"#7fe6b8","CONTROL"],["voyager","VOYAGER",3,"#fff2d2","CONTROL"],["archmage","ARCHMAGE",3,"#c2a3ff","CONTROL"],["corsair","CORSAIR",1,"#57e8c2","CONTROL"],["construct","CONSTRUCT",1,"#d4ff4f","SUPPORT"],["viking","VIKING",3,"#a9e2f5","CONTROL"],["archer","ARCHER",2,"#d8c76a","SUPPORT"],["shinobi","SHINOBI",4,"#ff6e5a","STEALTH"],["sage","PLAGUE SAGE",2,"#ead9ae","SUPPORT"],["abyssal","ABYSSAL",3,"#7fc9e8","ESCAPE"],["colossus","COLOSSUS",1,"#e0875a","SUPPORT"],["reaper","REAPER",4,"#e6f2f2","ESCAPE"],["duelist","DUELIST",3,"#ffd9e2","ESCAPE"],["monk","MONK",3,"#ffe6a8","STEALTH"],["valkyrie","VALKYRIE",4,"#e9ddff","ESCAPE"],["druid","DRUID",2,"#9fe89a","CONTROL"],["pyromancer","PYROMANCER",3,"#ff9a4d","CONTROL"],["cryomancer","CRYOMANCER",3,"#bfe8ff","CONTROL"],["stormcaller","STORMCALLER",3,"#dde9ff","STEALTH"],["paladin","PALADIN",3,"#ffe2b8","CONTROL"],["berserker","BERSERKER",1,"#ff7d5c","ESCAPE"],["assassin","ASSASSIN",4,"#c4b5ff","CONTROL"],["ranger","RANGER",2,"#bfe8a8","INSIGHT"],["beastmaster","BEASTMASTER",3,"#e8c99a","CONTROL"],["necromancer","NECROMANCER",4,"#9fe8c9","CONTROL"],["oracle","ORACLE",4,"#fff6d8","INSIGHT"],["alchemist","ALCHEMIST",2,"#c9f0a8","CONTROL"],["engineer","ENGINEER",2,"#ffd95c","CONTROL"],["marksman","MARKSMAN",3,"#c9d8e8","SUPPORT"],["hoplite","HOPLITE",2,"#e8b08a","CONTROL"],["gladiator","GLADIATOR",2,"#f0c9a8","CONTROL"],["ronin","RONIN",2,"#d8c9a0","ESCAPE"],["warlock","WARLOCK",3,"#a88fe8","STEALTH"],["legionary","LEGIONARY",3,"#ff9a8a","ESCAPE"],["flintlock","FLINTLOCK",1,"#e8d0a0","CONTROL"],["outrider","OUTRIDER",3,"#a8e8d8","ESCAPE"],["exorcist","EXORCIST",3,"#fff2c0","CONTROL"],["bountyhunter","BOUNTY HUNTER",4,"#ffcf8a","INSIGHT"],["psychopomp","PSYCHOPOMP",4,"#9fe0ff","ESCAPE"]];   /* [id, name, tier, colour, role] */
const BY={};ROSTER.forEach(r=>BY[r[0]]=r);
const TOTAL=ROSTER.length, LIVE_MS=75000;
const ALL_IDS=ROSTER.map(r=>r[0]);
const FREE_IDS=['colossus','corsair','construct','flintlock','berserker'];  /* the five the game gives everyone */

const app=document.getElementById('app'), who=document.getElementById('who');
const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms=v=>!v?0:typeof v.toMillis==='function'?v.toMillis():typeof v==='number'?v:v instanceof Date?v.getTime():0;
const pad2=n=>String(n).padStart(2,'0');
function clock(sec){sec=Math.max(0,sec||0);const t=Math.floor(sec*10),s=Math.floor(t/10),h=Math.floor(s/3600),m=Math.floor(s/60)%60;
  return (h?h+':'+pad2(m):m)+':'+pad2(s%60)+'.'+(t%10);}
function dur(sec){sec=Math.round(sec||0);const h=Math.floor(sec/3600),m=Math.floor(sec/60)%60;return h?h+'h '+pad2(m)+'m':m?m+'m':sec?sec+'s':'—';}
function ago(t){if(!t)return '—';const d=(Date.now()-t)/1000;
  if(d<45)return 'just now';if(d<3600)return Math.round(d/60)+' min ago';if(d<86400)return Math.round(d/3600)+' h ago';
  if(d<86400*14)return Math.round(d/86400)+' d ago';return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}
/* COMBO_NAME: every combined legend's name (its legends joined with +), filled from the players' records */
const COMBO_NAME={};
const legendName=id=>BY[id]?BY[id][1].replace(/(^|\s)(\S)(\S*)/g,(m,a,b,c)=>a+b+c.toLowerCase()):COMBO_NAME[id]?COMBO_NAME[id]:/^cx/.test(id||'')?'A combined legend':(id||'—');
const legendColour=id=>BY[id]?BY[id][3]:COMBO_FIRST[id]?BY[COMBO_FIRST[id]][3]:'#8c8573';
/* CHARACTER COMBINATIONS — a player's combined legends live in stats.combos as [{id:'cx…', p:[2 to 5 legend ids]}].
   It looks like (and everyone else sees) the first legend in p. */
const COMBO_MAX=5, COMBO_FIRST={};
/* A player can add legends to a combined legend later; the cloud keeps the older, shorter copy under the same id,
   so the one with the most legends is the real one (and writing the list back from here drops the old copies). */
const combosOf=p=>{const c=p&&p.stats&&p.stats.combos;
  const ok=Array.isArray(c)?c.filter(x=>x&&typeof x.id==='string'&&Array.isArray(x.p)&&x.p.length>=2&&x.p.every(id=>BY[id])):[];
  return ok.filter(x=>!ok.some(y=>y.id===x.id&&(y.p.length>x.p.length||(y.p.length===x.p.length&&ok.indexOf(y)<ok.indexOf(x)))));};
const comboName=x=>x.p.map(legendName).join(' + ');
/* ASH AND LEGEND UPGRADES — stats.ash is the ash a player holds; stats.ups lists 'legendId:level' and only ever
   grows (the game adds to it), so the highest level listed for a legend they own is its level. */
const UP_MAX=10;
const ashOf=p=>Math.max(0,Math.floor(((p&&p.stats)||{}).ash||0));
function upsOf(p){
  const o={},own=new Set((p&&p.unlocked)||[]),l=((p&&p.stats)||{}).ups;
  (Array.isArray(l)?l:[]).forEach(x=>{const m=/^([a-z0-9_]{1,40}):(\d{1,2})$/.exec(String(x));
    if(m&&own.has(m[1])&&BY[m[1]])o[m[1]]=Math.min(UP_MAX,Math.max(o[m[1]]||0,+m[2]));});
  return o;
}
const upTotal=p=>Object.values(upsOf(p)).reduce((a,b)=>a+b,0);
/* taking legends away from a player takes their upgrade levels with them */
const upsDrop=ids=>F.arrayRemove(...[].concat(...ids.map(id=>Array.from({length:UP_MAX},(_,i)=>id+':'+(i+1)))));
function nameCombos(){players.forEach(p=>combosOf(p).forEach(x=>{COMBO_FIRST[x.id]=x.p[0];COMBO_NAME[x.id]=x.p.map(id=>legendName(id)).join(' + ');}));}
const comboChip=(id,own)=>'<span class="cpart'+(own&&!own.has(id)?' gone':'')+'" style="--c:'+legendColour(id)+'"'
  +(own&&!own.has(id)?' title="Not in their vault any more"':'')+'>'+esc(legendName(id))+'</span>';
const titleCase=s=>String(s||'').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const providerName=p=>p==='google.com'?'Google':p==='password'?'email and password':(p||'email');

if(!firebaseConfig||!firebaseConfig.apiKey||!firebaseConfig.projectId){
  app.innerHTML='<div class="state"><h2>Not connected yet</h2><p>Fill in <code>firebase-config.js</code> with your Firebase project settings. SETUP.md walks through it.</p></div>';
  throw new Error('firebase-config.js is empty');
}
let A,F,auth,db;
try{
  const [a,b,c]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js'),import(SDK+'firebase-firestore.js')]);
  A=b;F=c;const fb=a.initializeApp(firebaseConfig);auth=A.getAuth(fb);db=F.getFirestore(fb);
}catch(e){
  app.innerHTML='<div class="state"><h2>Firebase could not load</h2><p>Check your internet connection and reload.</p></div>';
  throw e;
}

/* players: every players/{uid} doc (live); board: top of escapes/{id} (live); ptBoard: top of playtime/{uid} (live) */

   everything all guests have played. oldGuests = guest records left from before that (a co-op
   guest's id used to get a players/{uid} record) — they have no email; "Merge" folds them in. */

/* MOST TIME PLAYED — seeds playtime/{uid} for every player from the time saved on their profile.
   The game only creates a playtime entry once a player plays with the new code, so older players
   would otherwise be missing. Uses stats.activeTime when the game has recorded it, otherwise
   stats.playTime (their total time in the house, the only record kept before active time existed).
   Never lowers an entry the game has already written. */
async function seedPlaytime(){
  try{
    const ps=await F.getDocs(F.collection(db,'players'));
    let made=0,raised=0;
    for(const d of ps.docs){
      const p=d.data(),st=p.stats||{};
      if(isGuestDoc(p))continue;   /* guests are never on the board */
      const secs=Math.floor(st.activeTime>0?st.activeTime:(st.playTime||0));
      if(!(secs>0))continue;
      const nm=String(p.name||'Ghost').replace(/\s+/g,' ').trim().slice(0,40)||'Ghost';
      const ref=F.doc(db,'playtime',d.id),cur=await F.getDoc(ref);
      if(!cur.exists()){await F.setDoc(ref,{name:nm,seconds:secs,at:F.serverTimestamp()});made++;}
      else if((cur.data().seconds||0)<secs){await F.updateDoc(ref,{seconds:secs,at:F.serverTimestamp()});raised++;}
    }
    return made+raised;
  }catch(e){console.warn('Playtime seeding:',e);notice('Playtime import failed: '+e.message);return 0;}
}

/* Fold every old guest record into the one Guest accounts total, then delete it with everything
   it left behind (run history, any board entries or time-played entry). Cannot be undone. */
async function mergeOldGuests(){
  const list=oldGuests.slice();if(!list.length)return;
  if(!confirm('Merge '+plural(list.length,'old guest record')+' into Guest accounts?\n\nTheir time and escapes are added to the guest total, then the records are deleted. This cannot be undone.'))return;
  let done=0;
  try{
    for(const p of list){
      const st=p.stats||{},uid=p.uid;
      await F.setDoc(F.doc(db,'guestStats','total'),{seconds:F.increment(Math.floor(st.playTime||0)),
        active:F.increment(Math.floor(st.activeTime||0)),escapes:F.increment(Math.floor(p.escapes||0)),at:F.serverTimestamp()},{merge:true});
      for(;;){const r=await F.getDocs(F.query(F.collection(db,'players',uid,'runs'),F.limit(300)));
        if(r.empty)break;const b=F.writeBatch(db);r.docs.forEach(d=>b.delete(d.ref));await b.commit();if(r.size<300)break;}
      const es=await F.getDocs(F.query(F.collection(db,'escapes'),F.where('uid','==',uid),F.where('team','==',false)));
      for(const d of es.docs)await F.deleteDoc(d.ref);
      try{await F.deleteDoc(F.doc(db,'playtime',uid));}catch(e){}
      try{await F.deleteDoc(F.doc(db,'leaderboard',uid));}catch(e){}
      try{const k=unameKey(p.name),r=F.doc(db,'usernames',k),d=await F.getDoc(r);if(k&&d.exists()&&d.data().uid===uid)await F.deleteDoc(r);}catch(e){}
      await F.deleteDoc(F.doc(db,'players',uid));
      done++;
    }
    notice('Merged '+plural(done,'guest record')+' into Guest accounts');
  }catch(e){notice('Stopped after '+done+': '+e.message);}
}

/* Usernames: one per account, unique (usernames/{key} = {uid, name}; key = lower-case letters and digits only).
   The key a name maps to, and whether a name is allowed at all, mirror firestore.rules and cloud.js. */
const unameKey=n=>String(n||'').toLowerCase().replace(/[^a-z0-9]/g,'');
/* a co-op entry's name ("A+B") after one of its players changed username. members (newer entries) lists
   the players' accounts in the same order as the names; older entries only have the names, so the old
   name is looked for (also cut short, as long team names are). null = this player is not in it. */
function teamRenamed(name,members,uid,oldName,newName){
  const k=n=>String(n||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const segs=String(name||'').split('+');
  let i=Array.isArray(members)&&members.length===segs.length?members.indexOf(uid):-1;
  if(i<0&&oldName){const ok=k(oldName);
    i=segs.findIndex(sg=>k(sg)===ok);
    if(i<0)i=segs.findIndex(sg=>k(sg).length>=3&&ok.indexOf(k(sg))===0&&String(name).length>=36);}
  if(i<0||segs[i]===newName)return null;
  segs[i]=newName;
  let t=segs.join('+');
  if(t.length>40){const each=Math.max(3,Math.floor((40-(segs.length-1))/segs.length));t=segs.map(n=>n.slice(0,each)).join('+').slice(0,40);}
  return t;
}
/* put a player's new name into every co-op entry they are in (or, given an old name, every entry that has it) */
async function renameInTeams(uid,oldName,newName){
  const snap=await F.getDocs(F.query(F.collection(db,'escapes'),F.where('team','==',true)));
  let n=0;
  for(const d of snap.docs){const v=d.data();
    const mine=Array.isArray(v.members)&&v.members.indexOf(uid)>=0;
    const t=teamRenamed(v.name,mine?v.members:null,uid,oldName,newName);
    if(t&&t!==v.name){await F.updateDoc(d.ref,{name:t});n++;}}
  return n;
}

const unameOk=n=>/^[A-Za-z0-9 _.-]{2,24}$/.test(String(n||''))&&unameKey(n).length>=2;
/* Reserve each existing account's current name, OLDEST ACCOUNT FIRST, wherever it is valid and still free.
   Anyone left out (a clash, or a name that is not allowed such as a long Google name) is asked to choose
   a new one the next time they sign in to the game. Safe to run again; runs once per browser. */
async function seedUsernames(){

    if(localStorage.getItem('hm_unames_seeded_v1'))return;
    const snap=await F.getDocs(F.query(F.collection(db,'players'),F.orderBy('createdAt'),F.limit(1000)));

      if((await F.getDoc(ref)).exists())continue;
      await F.setDoc(ref,{uid:d.id,name:nm,at:F.serverTimestamp()});made++;
    }

    if(made)notice('Reserved '+made+' usernames');

}
/* Fills the new board with EVERY escape ever made:
     · every escape in every player's run history (players/{uid}/runs, result "escape")
     · every old leaderboard/{uid} best time (covers escapes from before run history was kept)
     · the seed entries above
   Nothing is added twice: an escape is skipped when that player already has an entry with the
   same time (to a tenth of a second). Runs once per browser; "Re-import past escapes" runs it again. */
const IMPORT_FLAG='hm_board_import_v3';
/* difficulty levels: each has its own board. Entries from before they existed count as Normal. */
const DIFF_KEYS=['easy','normal','hard','nightmare'],DIFF_NAME={easy:'Easy',normal:'Normal',hard:'Hard',nightmare:'Nightmare'};
const diffOf=r=>DIFF_KEYS.indexOf(r&&r.diff)>=0?r.diff:'normal';
let boardDiff='all',boardMode='best';   /* best: each player once, at their fastest */
function bestPerPlayer(list){const k=n=>String(n||'').toLowerCase().replace(/[^a-z0-9]/g,'');const seen=new Set(),out=[];
  for(const r of list){const who=r.team?String(r.name||'').split('+').map(k).filter(Boolean):[k(r.name)||'u:'+r.uid];
    if(!who.length||who.every(x=>seen.has(x)))continue;who.forEach(x=>seen.add(x));out.push(r);}return out;}
async function migrateBoard(adminUid,force){
  try{
    for(const e of SEED_ESCAPES){
      const ref=F.doc(db,'escapes',e.id);
      if(!(await F.getDoc(ref)).exists())
        await F.setDoc(ref,{uid:adminUid,name:e.name,time:e.time,legend:e.legend,deaths:e.deaths,embers:e.embers,team:e.team,diff:'normal',at:F.serverTimestamp()});
    }
    if(!force&&localStorage.getItem(IMPORT_FLAG))return;
    const t10=v=>Math.round((+v||0)*10);
    const [ps,old]=await Promise.all([F.getDocs(F.collection(db,'players')),F.getDocs(F.collection(db,'leaderboard'))]);
    const oldBest={};old.docs.forEach(d=>{oldBest[d.id]=d.data();});
    const uids=new Set(ps.docs.map(d=>d.id).concat(Object.keys(oldBest)));
    const pname={};ps.docs.forEach(d=>{pname[d.id]=d.data().name;});
    /* guests are never on the board */
    ps.docs.forEach(d=>{if(isGuestDoc(d.data()))uids.delete(d.id);});
    let batch=F.writeBatch(db),n=0,added=0;
    const put=async(ref,data)=>{batch.set(ref,data);n++;added++;if(n>=400){await batch.commit();batch=F.writeBatch(db);n=0;}};
    for(const uid of uids){
      /* what this player already has on the board */
      const have=new Set((await F.getDocs(F.query(F.collection(db,'escapes'),F.where('uid','==',uid)))).docs
        .filter(d=>!d.data().team).map(d=>t10(d.data().time)));
      const name=String(pname[uid]||(oldBest[uid]&&oldBest[uid].name)||'Ghost').slice(0,40);
      /* every escape in their run history */
      if(pname[uid]!==undefined){
        const runs=await F.getDocs(F.query(F.collection(db,'players',uid,'runs'),F.where('result','==','escape')));
        for(const r of runs.docs){
          const x=r.data(),t=Math.round((+x.nightTime||0)*10)/10;
          if(!(t>=20)||have.has(t10(t)))continue;
          have.add(t10(t));
          await put(F.doc(db,'escapes','run_'+uid+'_'+r.id),{uid,name,time:t,legend:String(x.legend||'').slice(0,40),
            deaths:Math.max(0,Math.floor(x.deathsTonight||0)),embers:Math.max(0,Math.floor(x.embers||0)),
            team:false,diff:DIFF_KEYS.indexOf(x.diff)>=0?x.diff:'normal',at:x.at||F.serverTimestamp()});
        }
      }
      /* their old best, if it is not one of those */
      const ob=oldBest[uid];
      if(ob&&ob.bestTime>=20){
        const team=String(ob.name||'').indexOf('+')>=0;
        const ref=F.doc(db,'escapes','lb_'+uid);
        if(team||!have.has(t10(ob.bestTime))){
          if(!(await F.getDoc(ref)).exists()){
            have.add(t10(ob.bestTime));
            await put(ref,{uid,name:team?String(ob.name).slice(0,40):name,time:ob.bestTime,legend:String(ob.legend||''),
              deaths:Math.max(0,Math.floor(ob.deaths||0)),embers:Math.max(0,Math.floor(ob.embers||0)),
              team,diff:'normal',at:ob.at||F.serverTimestamp()});}}
      }
    }
    if(n)await batch.commit();
    localStorage.setItem(IMPORT_FLAG,'1');
    notice(added?'Imported '+added+' past escape'+(added===1?'':'s'):'Every past escape is already on the board');
  }catch(e){console.warn('Board import:',e);notice('Import failed: '+e.message);}
}

  unsubBoard=F.onSnapshot(F.query(F.collection(db,'escapes'),F.orderBy('time'),F.limit(500)),snap=>{

async function patch(uid,data,msg){

/* Grant or seal one legend. Sealing the one they are bound to rebinds them to
   something they still own, so the game never tries to load a sealed legend. */
function toggleLegend(uid,id){
  const p=players.find(x=>x.uid===uid);if(!p)return;
  const own=new Set(p.unlocked||[]),had=own.has(id);
  had?own.delete(id):own.add(id);
  const list=ALL_IDS.filter(x=>own.has(x)),upd={unlocked:list};
  if(had&&p.main===id)upd.main=list[0]||FREE_IDS[0];
  if(had)upd.stats={ups:upsDrop([id])};
  /* the game puts a combined legend's legends back in the vault, so sealing one takes its combinations too */
  const cs=combosOf(p),hit=had?cs.filter(x=>x.p.indexOf(id)>=0):[];
  if(hit.length){
    if(!confirm(legendName(id)+' is part of '+hit.map(comboName).join(', ')+'. Sealing it removes '+(hit.length===1?'that combination':'those combinations')+' too. Go on?'))return;
    upd.stats=Object.assign(upd.stats||{},{combos:cs.filter(x=>hit.indexOf(x)<0).map(x=>({id:x.id,p:x.p.slice()}))});
    if(hit.some(x=>x.id===p.main))upd.main=list[0]||FREE_IDS[0];
  }
  patch(uid,upd,(had?'Sealed ':'Granted ')+legendName(id));
}
function grantAll(uid){patch(uid,{unlocked:ALL_IDS.slice()},'All '+TOTAL+' legends granted');}
function revokeAll(uid){
  const p=players.find(x=>x.uid===uid);if(!p)return;
  const cs=combosOf(p),left=cs.filter(x=>x.p.every(id=>FREE_IDS.indexOf(id)>=0));
  if(!confirm('Seal every legend except the five the game gives everyone?'+(cs.length>left.length?' Their combined legends made with any other legend go too.':'')))return;
  const keep=ALL_IDS.filter(x=>FREE_IDS.indexOf(x)>=0),upd={unlocked:keep,main:keep.indexOf(p.main)>=0||left.some(x=>x.id===p.main)?p.main:keep[0]};
  if(cs.length>left.length)upd.stats={combos:left.map(x=>({id:x.id,p:x.p.slice()}))};
  const gone=(p.unlocked||[]).filter(id=>keep.indexOf(id)<0);
  if(gone.length)upd.stats=Object.assign(upd.stats||{},{ups:upsDrop(gone)});
  patch(uid,upd,'Back to the five starting legends');
}

/* Save the whole form in one write. Blank or nonsense values keep what was there. */
function saveForm(uid){
  const p=players.find(x=>x.uid===uid);if(!p)return;
  const val=id=>{const el=document.getElementById(id);return el?el.value:'';};
  const int=(id,fb)=>{const x=parseInt(val(id),10);return isFinite(x)&&x>=0?x:fb;};
  const flt=(id,fb)=>{const x=parseFloat(val(id));return isFinite(x)&&x>=0?x:fb;};
  const st=Object.assign({},p.stats||{});
  st.deaths=int('e_deaths',st.deaths||0);
  st.runs=int('e_runs',st.runs||0);
  st.playTime=int('e_play',Math.round((st.playTime||0)/60))*60;
  st.embers=int('e_embers',st.embers||0);
  st.memories=int('e_mem',st.memories||0);
  st.etherEarned=int('e_earned',st.etherEarned||0);
  st.ash=int('e_ash',ashOf(p));
  delete st.ups;   /* levels are only added by the game; writing this copy back could undo one bought a moment ago */
  const best=flt('e_best',0);
  if(best>0)st.bestTime=best;else delete st.bestTime;
  const newName=String(val('e_name')||p.name||'Unnamed').replace(/\s+/g,' ').trim().slice(0,24);
  saveWithName(uid,p,newName,st);
}
/* A name change from here goes through the same one-name-per-account check the game uses. */
async function saveWithName(uid,p,newName,st){
  const val=id=>{const el=document.getElementById(id);return el?el.value:'';};
  const int=(id,fb)=>{const x=parseInt(val(id),10);return isFinite(x)&&x>=0?x:fb;};
  try{
    if(newName!==p.name){
      if(!unameOk(newName)){alert('Usernames are 2\u201324 letters, numbers, spaces, dots, dashes or underscores.');return;}
      const key=unameKey(newName),ref=F.doc(db,'usernames',key),cur=await F.getDoc(ref);
      if(cur.exists()&&cur.data().uid!==uid){alert('"'+newName+'" already belongs to '+(cur.data().name||'another player')+'. Usernames must be unique.');return;}
      await F.setDoc(ref,{uid,name:newName,at:F.serverTimestamp()});
      const oldKey=unameKey(p.name);
      if(oldKey&&oldKey!==key){
        const old=await F.getDoc(F.doc(db,'usernames',oldKey));
        if(old.exists()&&old.data().uid===uid)await F.deleteDoc(F.doc(db,'usernames',oldKey));}
      /* their past solo escapes and time-played entry carry the new name */
      try{
        const es=await F.getDocs(F.query(F.collection(db,'escapes'),F.where('uid','==',uid),F.where('team','==',false)));
        for(const d of es.docs)await F.updateDoc(d.ref,{name:newName});
        const nt=await renameInTeams(uid,p.name,newName);   /* and the co-op entries they are in */
        if(nt)notice('Also renamed in '+nt+' co-op '+(nt===1?'entry':'entries')+'.');
        const pt=await F.getDoc(F.doc(db,'playtime',uid));
        if(pt.exists())await F.updateDoc(pt.ref,{name:newName});
      }catch(e){console.warn('Renaming their board entries:',e);}
    }
  }catch(e){alert('Could not change the name: '+e.message);return;}
  patch(uid,{
    name:newName,
    ether:int('e_ether',p.ether||0),
    main:val('e_main')||p.main||FREE_IDS[0],
    escapes:int('e_escapes',p.escapes||0),
    stats:st
  },'Record saved');
}

/* Firestore does not cascade into subcollections, so the runs go first.
   This does NOT delete their Firebase sign-in account. */
async function deletePlayer(uid){
  const p=players.find(x=>x.uid===uid);if(!p)return;
  const nm=p.name||'this player';
  if(!confirm('Delete '+nm+"'s record?\n\nProgress, run history and their leaderboard time all go. Their sign-in account stays, so if they sign in again the game starts them fresh.\n\nThis cannot be undone."))return;
  if(!confirm('Last chance — really delete '+nm+'?'))return;
  try{
    for(;;){
      const s=await F.getDocs(F.query(F.collection(db,'players',uid,'runs'),F.limit(300)));
      if(s.empty)break;
      const b=F.writeBatch(db);s.docs.forEach(d=>b.delete(d.ref));await b.commit();
      if(s.size<300)break;
    }
    try{await F.deleteDoc(F.doc(db,'leaderboard',uid));}catch(e){}
    try{await F.deleteDoc(F.doc(db,'playtime',uid));}catch(e){}
    /* free their username so someone else can take it */
    try{const k=unameKey(p.name),r=F.doc(db,'usernames',k),d=await F.getDoc(r);if(k&&d.exists()&&d.data().uid===uid)await F.deleteDoc(r);}catch(e){}
    await F.deleteDoc(F.doc(db,'players',uid));
    delete runsCache[uid];
    closeDrawer();
  }catch(e){alert('Could not delete the record: '+e.message);}
}

async function openDrawer(uid){
  openUid=uid;editing=false;note='';drawer.hidden=false;scrim.hidden=false;renderDrawer();
  try{
    /* No orderBy: Firestore silently drops any document missing the ordered
       field, so a run written without "at" would never appear. Sort here. */
    const s=await F.getDocs(F.query(F.collection(db,'players',uid,'runs'),F.limit(100)));
    runsCache[uid]=s.docs.map(d=>Object.assign({id:d.id},d.data()))
      .sort((a,b)=>ms(b.at)-ms(a.at)).slice(0,25);
  }catch(e){runsCache[uid]={error:e.message};}
  if(openUid===uid)renderDrawer();
}

  if(used.length){
    const max=uses[used[0]];
    h+='<h3>Most played legends</h3><div class="uses">'+used.slice(0,8).map(id=>'<span>'+esc(legendName(id))+'</span><div class="bar" style="--c:'+legendColour(id)+'"><i style="width:'+(uses[id]/max*100).toFixed(1)+'%"></i></div><span class="num r" style="text-align:right">'+uses[id]+'</span>').join('')+'</div>';
  }
  h+='<h3>Legends <small>'+own.size+' declassified'+(editing?' · click one to grant or seal it':'')+'</small></h3>';
  [1,2,3,4].forEach(t=>{
    const list=ROSTER.filter(r=>r[2]===t);
    h+='<div class="tier">Tier '+['','I','II','III','IV'][t]+' · '+list.filter(r=>own.has(r[0])).length+' of '+list.length+'</div><div class="legends">'
      +list.map(r=>'<div class="lg'+(own.has(r[0])?' own':'')+(p.main===r[0]?' bound':'')+(editing?' can':'')+'" style="--c:'+r[3]+'"'
        +(editing?' data-grant="'+esc(r[0])+'" role="button" tabindex="0" title="'+(own.has(r[0])?'Seal':'Grant')+' '+esc(legendName(r[0]))+'"':'')
        +'>'+esc(legendName(r[0]))+'<small>'+(own.has(r[0])?(p.main===r[0]?'bound · ':'')+'level '+(ups[r[0]]||0)+' · '+(uses[r[0]]||0)+' runs':'sealed')+'</small></div>').join('')+'</div>';
  });
  h+=comboSection(p);
  const runs=runsCache[p.uid];
  h+='<h3>Recent runs</h3>';
  if(!runs)h+='<p class="empty">Loading…</p>';
  else if(runs.error)h+='<p class="err">'+esc(runs.error)+'</p>';
  else if(!runs.length)h+='<p class="empty">'+(st.runs
      ?plural(st.runs,'run')+' counted in the stats, but none recorded here \u2014 those were played before this account signed in. Only runs finished while signed in get a record.'
      :'No runs logged yet.')+'</p>';
  else h+='<ul class="runs">'+runs.map(r=>'<li'+(editing?' class="ed"':'')+'><span class="res '+esc(r.result)+'">'+(r.result==='escape'?'Escaped':'Devoured')+'</span>'
      +'<span><span class="dot" style="background:'+legendColour(r.legend)+'"></span>'+esc(legendName(r.legend))+'<div class="meta">'
      +(r.result==='escape'?'Night took '+clock(r.nightTime):'On '+esc(titleCase(r.floor)||'?')+' at '+clock(r.nightTime))+' · '+(r.embers||0)+'/8 embers · +'+(r.ether||0)+' ether'
      +(r.result==='escape'&&!r.seen?' · never seen':'')+'</div></span><span class="meta">'+ago(ms(r.at))+'</span>'
      +(editing&&r.id?'<button class="rx" data-run="'+esc(r.id)+'" title="Delete this run" aria-label="Delete this run">×</button>':'')
      +'</li>').join('')+'</ul>';
  /* a live snapshot can redraw the drawer mid-typing, so put the caret back */
  const act=document.activeElement, actId=act&&drawer.contains(act)?act.id:null;
  let caret=null;try{caret=actId?act.selectionStart:null;}catch(e){}
  drawer.innerHTML=h;drawer.scrollTop=scroll;
  if(actId){const el=document.getElementById(actId);
    if(el){el.focus();if(caret!=null){try{el.setSelectionRange(caret,caret);}catch(e){}}}}
  document.getElementById('dx').onclick=closeDrawer;
  document.getElementById('dedit').onclick=()=>{editing=!editing;note='';renderDrawer();};
  if(!editing)return;
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
  on('e_save',()=>saveForm(p.uid));
  on('e_post',()=>postToLeaderboard(p.uid));
  on('e_fixteam',()=>fixTeamName(p.uid));
  on('e_grant',()=>grantAll(p.uid));
  on('e_revoke',()=>revokeAll(p.uid));
  on('e_pend',()=>clearPending(p.uid));
  on('e_del',()=>deletePlayer(p.uid));
  drawer.querySelectorAll('[data-grant]').forEach(el=>{
    el.onclick=()=>toggleLegend(p.uid,el.dataset.grant);
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleLegend(p.uid,el.dataset.grant);}};});
  drawer.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>deleteRun(p.uid,b.dataset.run));
  drawer.querySelectorAll('[data-cpick]').forEach(el=>el.onclick=()=>{const id=el.dataset.cpick,k=cmbPick.indexOf(id);
    if(k>=0)cmbPick.splice(k,1);else if(cmbPick.length<COMBO_MAX)cmbPick.push(id);renderDrawer();});
  drawer.querySelectorAll('[data-crm]').forEach(b=>b.onclick=()=>removeCombo(p.uid,b.dataset.crm));
  on('e_cadd',()=>addCombo(p.uid));
}
/* the player's combined legends; while editing, remove one or put one together for them */
function comboSection(p){
  const cs=combosOf(p),own=new Set(p.unlocked||[]),uses=(p.stats||{}).legendRuns||{};
  let h='<h3>Character combinations <small>'+plural(cs.length,'combined legend')+'</small></h3>';
  h+=cs.length?'<ul class="combos">'+cs.map(x=>'<li><span class="cparts">'+x.p.map(id=>comboChip(id,own)).join('')+'</span>'
      +'<span class="cmeta">'+plural(uses[x.id]||0,'night')+(p.main===x.id?' \u00b7 bound now':'')+'</span>'
      +(editing?'<button class="mini warn" data-crm="'+esc(x.id)+'">Remove</button>':'')+'</li>').join('')+'</ul>'
    :'<p class="empty">No combined legends.</p>';
  if(editing){
    cmbPick=cmbPick.filter(id=>BY[id]);
    const dup=cmbPick.length>=2&&cs.some(x=>x.p.slice().sort().join('|')===cmbPick.slice().sort().join('|'));
    h+='<div class="edits" style="margin-top:12px"><h4>Put a combination together</h4>'
      +'<div class="hint">Pick 2 to '+COMBO_MAX+' legends in order (the first is the one it looks like). It costs them nothing, and any picked legend they do not own is granted with it.</div>'
      +'<div class="cparts" style="margin-top:8px">'+ALL_IDS.filter(id=>id!=='god').map(id=>{const k=cmbPick.indexOf(id);
        return '<span class="cpart pick'+(k>=0?' on':'')+'" data-cpick="'+esc(id)+'" style="--c:'+legendColour(id)+'">'+(k>=0?'<b>'+(k+1)+'</b>':'')+esc(legendName(id))+(own.has(id)?'':' \u00b7 sealed')+'</span>';}).join('')+'</div>'
      +'<div class="editbar"><button class="btn primary" id="e_cadd"'+(cmbPick.length>=2&&!dup?'':' disabled')+'>'
      +(dup?'They already have this combination':'Add '+(cmbPick.length>=2?cmbPick.map(legendName).join(' + '):'combination'))+'</button></div></div>';
  }
  return h;
}
let cmbPick=[];
function addCombo(uid){
  const p=players.find(x=>x.uid===uid);if(!p||cmbPick.length<2)return;
  const cs=combosOf(p).map(x=>({id:x.id,p:x.p.slice()})),pick=cmbPick.slice();
  if(cs.some(x=>x.p.slice().sort().join('|')===pick.slice().sort().join('|')))return;
  cs.push({id:'cx'+Date.now().toString(36),p:pick});
  const own=new Set(p.unlocked||[]);pick.forEach(id=>own.add(id));
  cmbPick=[];
  patch(uid,{unlocked:ALL_IDS.filter(x=>own.has(x)).concat((p.unlocked||[]).filter(x=>!BY[x])),stats:{combos:cs}},'Added '+pick.map(legendName).join(' + '));
}
function removeCombo(uid,id){
  const p=players.find(x=>x.uid===uid);if(!p)return;
  const x=combosOf(p).find(c=>c.id===id);if(!x)return;
  if(!confirm('Remove '+comboName(x)+' from '+(p.name||'this player')+'?\n\nThey keep the legends it was made of. If their game is open right now it will put the combination back, so do this while they are away.'))return;
  const upd={stats:{combos:combosOf(p).filter(c=>c.id!==id).map(c=>({id:c.id,p:c.p.slice()}))}};
  if(p.main===id)upd.main=x.p[0];
  patch(uid,upd,'Removed '+comboName(x));
}

/* the edit form: name, ether, the counters, and the buttons that act at once */
function editPanel(p){
  const st=p.stats||{}, own=new Set(p.unlocked||[]);
  const ownIds=ALL_IDS.filter(id=>own.has(id));
  const opts=(ownIds.length?ownIds:FREE_IDS).concat(combosOf(p).map(x=>x.id)).map(id=>'<option value="'+esc(id)+'"'+(p.main===id?' selected':'')+'>'+esc(legendName(id))+'</option>').join('');
  const field=(id,label,v,extra)=>'<div><label for="'+id+'">'+label+'</label><input id="'+id+'" type="number" min="0" '+(extra||'')+' value="'+v+'"></div>';
  return '<div class="edits"><h4>Keeper\'s edits</h4>'
    +'<div class="hint">These write straight to the player\'s record. The legend tiles below are clickable while this is open.</div>'
    +'<div class="frm">'
    +'<div style="grid-column:1/-1"><label for="e_name">Username (unique \u2014 shown on the leaderboards)</label><input id="e_name" type="text" maxlength="24" value="'+esc(p.name||'')+'"></div>'
    +field('e_ether','Ether',p.ether||0)
    +field('e_escapes','Escapes',p.escapes||0)
    +field('e_deaths','Deaths',st.deaths||0)
    +field('e_runs','Runs',st.runs||0)
    +field('e_best','Best night (sec)',st.bestTime||'','step="0.1"')
    +field('e_play','Time played (min)',Math.round((st.playTime||0)/60))
    +field('e_embers','Embers carried',st.embers||0)
    +field('e_mem','Memories found',st.memories||0)
    +field('e_earned','Ether earned',st.etherEarned||0)
    +field('e_ash','Ash',ashOf(p))
    +'<div style="grid-column:1/-1"><label for="e_main">Haunts as</label><select id="e_main">'+opts+'</select></div>'
    +'</div>'
    +'<div class="editbar"><button class="btn primary" id="e_save">Save changes</button>'
    +'<button class="btn" id="e_post">Post to leaderboard</button>'
    +'<button class="btn" id="e_grant">Grant all '+TOTAL+' legends</button>'
    +'<button class="btn" id="e_revoke">Reset legends</button>'
    +((p.pending||[]).length?'<button class="btn" id="e_pend">Clear unclaimed ether</button>':'')
    +(note?'<span class="saved">'+esc(note)+'</span>':'')+'</div>'
    +'<div class="frm" style="margin-top:12px"><div style="grid-column:1/-1"><label for="e_oldname">Co-op entries still show an old name? Type it, and it becomes \u201c'+esc(p.name||'')+'\u201d</label>'
      +'<div style="display:flex;gap:8px"><input id="e_oldname" type="text" maxlength="40" placeholder="The old name, e.g. Rajeshwari V" style="flex:1"><button class="btn" id="e_fixteam">Replace in co-op entries</button></div></div></div>'
    +'<div class="danger"><button class="btn bad" id="e_del">Delete this player\'s record</button></div>'
    +'</div>';
}
</script>
</body>
</html>
