<!DOCTYPE html>
<!--
  HOLLOWMERE — CO-OP LOBBY
  Make a room, share the five-letter code (or the link), and the host begins the night.
  The manor is built for the size of the party: the more souls, the more floors — and one
  hunter per soul. Everything here is light; the game itself loads when the night begins.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HOLLOWMERE — CO-OP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%;background:#04050a;font-family:'IM Fell English',serif;color:#cfc8b8}
  body{display:flex;align-items:center;justify-content:center;padding:24px 16px;
    background:radial-gradient(ellipse at 50% 30%,#0d0f18 0%,#04050a 70%)}
  main{width:min(460px,100%);text-align:center}
  h1{font-family:'Cormorant SC',serif;font-weight:600;font-size:clamp(34px,9vw,52px);letter-spacing:12px;color:#d9d2bd;
    text-shadow:0 0 24px rgba(120,150,220,.25);padding-left:12px}
  h2{font-family:'Cormorant SC',serif;font-weight:400;font-size:14px;letter-spacing:6px;color:#8f8874;margin:6px 0 22px;padding-left:6px}
  .card{background:#06070c;border:1px solid #3a3630;padding:22px 24px;text-align:left;box-shadow:0 30px 80px rgba(0,0,0,.8)}
  .note{font-size:15px;line-height:1.55;color:#a89f8a;font-style:italic}
  .note.small{font-size:13px;margin-top:10px}
  label{display:block;font-size:12px;letter-spacing:3px;color:#6f6a5c;margin-top:14px;font-family:'Cormorant SC',serif}
  input{display:block;width:100%;margin-top:6px;padding:10px 12px;background:rgba(15,17,26,.9);border:1px solid #3a3630;color:#e5dcc2;
    font-family:'IM Fell English',serif;font-size:17px;border-radius:0;outline:none}
  input:focus{border-color:#9fc4ff}
  input.code{text-transform:uppercase;letter-spacing:8px;text-align:center;font-size:22px}
  button{display:block;width:100%;margin-top:12px;padding:11px 12px;border:1px solid #3a3630;background:rgba(15,17,26,.8);color:#e5dcc2;
    font-family:'IM Fell English',serif;font-size:16px;letter-spacing:1px;cursor:pointer}
  button:hover:not([disabled]),button:focus-visible{border-color:#8a7f60;color:#fff;outline:none}
  button.primary{border-color:#8a7f60;background:rgba(40,32,20,.8)}
  button[disabled]{opacity:.5;cursor:default}
  .or{margin:18px 0 0;text-align:center;font-size:12px;letter-spacing:3px;color:#5f6c85}
  .err{min-height:20px;margin-top:12px;font-size:14px;line-height:1.4;color:#ff8f6f}
  .err.ok{color:#bfead0}
  .code-big{font-family:'Cormorant SC',serif;font-size:46px;letter-spacing:14px;color:#ffbe6f;text-align:center;padding-left:14px;
    text-shadow:0 0 18px rgba(255,150,60,.35)}
  .code-cap{text-align:center;font-size:12px;letter-spacing:4px;color:#6f6a5c;font-family:'Cormorant SC',serif}
  ul{list-style:none;margin-top:16px;border-top:1px solid rgba(160,150,130,.14)}
  li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(160,150,130,.14);font-size:17px}
  li .dot{width:9px;height:9px;border-radius:50%;background:#9fc4ff;box-shadow:0 0 8px #9fc4ff}
  li .tag{margin-left:auto;font-size:11px;letter-spacing:2px;color:#ffbe6f;font-family:'Cormorant SC',serif}
  .size{margin-top:16px;padding:12px;border:1px solid #2a2620;background:rgba(15,17,26,.5);text-align:center;font-size:15px;color:#a89f8a}
  .size b{color:#ffbe6f;font-weight:normal}
  .back{display:inline-block;margin-top:18px;font-size:13px;color:#6f6a5c;letter-spacing:2px;text-decoration:none;font-family:'Cormorant SC',serif}
  .back:hover{color:#cfc8b8}
  .row{display:flex;gap:10px}
  .row button{margin-top:12px}
  .inv{margin-top:16px;border-top:1px solid rgba(160,150,130,.14);padding-top:10px}
  .inv .cap{font-size:12px;letter-spacing:.18em;color:#8a826e;margin-bottom:6px}
  .inv .fr{display:flex;align-items:center;gap:10px;padding:6px 0}
  .inv .fr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .inv .fr small{color:#6f6a5c;font-size:12px;margin-left:6px}
  .inv .fr button{width:auto;margin:0;padding:6px 14px;font-size:14px}
  .inv .fr button.done{border-color:#4f6b4a;color:#9fd29a}
  .invin{margin-top:14px;padding:10px 12px;border:1px solid #8a7f60;background:rgba(40,32,20,.55)}
  .invin b{color:#ffcf8a}
  .invin .row2{display:flex;gap:8px}.invin .row2 button{margin-top:10px}
  li.talk .dot{background:#9fd18a;box-shadow:0 0 10px #9fd18a}
  li.talk span:first-of-type{color:#9fd18a}
  button.mic.on{border-color:rgba(159,209,138,.6);color:#9fd18a}
  button.mic.on.talk{box-shadow:0 0 12px rgba(159,209,138,.7)}
</style>
</head>
<body>
<main>
  <h1>HOLLOWMERE</h1>
  <h2>CO-OP · THE HEART HUNGERS FOR MORE</h2>
  <div class="card" id="card"><p class="note">Reaching the house…</p></div>
  <a class="back" id="backLink" href="index.html">‹ BACK TO THE TITLE</a>
</main>
<script type="module">
import * as mp from './multiplayer.js';

const card = document.getElementById('card');
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const qs = new URLSearchParams(location.search);
let lobbyDiff = (() => { try { const d = localStorage.getItem('hollowmere_lobby_diff'); return ['easy','normal','hard','nightmare'].indexOf(d) >= 0 ? d : 'normal'; } catch (e) { return 'normal'; } })();
let code = '', room = null, unsub = null, msg = '', msgOk = false, busy = false, leaving = false, launched = false;
/* ---------------- invites (signed-in players with a username only) ---------------- */
const FR = { started: false, uids: [], pres: {}, presUnsub: {}, sent: {}, inc: [] };
function friendsStart() {
  if (FR.started || !mp.me.account) return; FR.started = true;
  mp.onFriendsOf(mp.me.uid, uids => {
    FR.uids = uids;
    Object.keys(FR.presUnsub).forEach(u => { if (uids.indexOf(u) < 0) { FR.presUnsub[u](); delete FR.presUnsub[u]; delete FR.pres[u]; } });
    uids.forEach(u => { if (!FR.presUnsub[u]) FR.presUnsub[u] = mp.onPresence(u, v => { FR.pres[u] = v; renderInv(); }); });
    renderInv();
  });
  mp.onInvites(mp.me.uid, list => { FR.inc = list; renderIncoming(); });
}
/* the host's (or anyone's) list of online friends to ask in */
function renderInv() {
  const el = document.getElementById('inv'); if (!el || !room) return;
  const inRoom = room.players || {};
  const online = FR.uids.filter(u => FR.pres[u] && FR.pres[u].n && !inRoom[u])
    .sort((a, b) => String(FR.pres[a].n).localeCompare(String(FR.pres[b].n)));
  el.innerHTML = '<div class="cap">INVITE FRIENDS</div>' + (online.length
    ? online.map(u => { const p = FR.pres[u], sent = FR.sent[u] === code;
        const what = p.st === 'night' ? (p.mp ? 'in a co-op night' : 'in a night') : 'online';
        return '<div class="fr"><span>' + esc(p.n) + '<small>' + what + '</small></span><button data-inv="' + esc(u) + '"' + (sent ? ' class="done"' : '') + '>' + (sent ? 'Invited ✓' : 'Invite') + '</button></div>'; }).join('')
    : '<p class="note small" style="margin-top:0">' + (FR.uids.length ? 'None of your friends has Hollowmere open right now. Friends show up here while the game is open on their device.' : 'Add friends from the FRIENDS button on the title screen, then invite them here.') + '</p>');
  el.querySelectorAll('[data-inv]').forEach(b => b.onclick = async () => {
    const u = b.getAttribute('data-inv'); b.disabled = true;
    try { await mp.sendInvite(u, code); FR.sent[u] = code; setMsg('Invite sent to ' + ((FR.pres[u] && FR.pres[u].n) || 'your friend') + '.', true); }
    catch (e) { console.warn(e); setMsg(mp.friendlyError(e)); }
    renderInv();
  });
}
/* invites waiting for this player (shown on the menu) */
function renderIncoming() {
  const el = document.getElementById('invin'); if (!el) return;
  const list = FR.inc.filter(x => x.c !== code);
  el.innerHTML = list.slice(0, 3).map(x => '<div class="invin"><b>' + esc(x.n) + '</b> invites you into room <b>' + esc(x.c) + '</b>.'
    + '<div class="row2"><button class="primary" data-ij="' + esc(x.from) + '">Join</button><button data-ix="' + esc(x.from) + '">Not now</button></div></div>').join('');
  el.querySelectorAll('[data-ij]').forEach(b => b.onclick = () => {
    const x = FR.inc.find(i => i.from === b.getAttribute('data-ij')); if (!x) return;
    mp.clearInvite(mp.me.uid, x.from);
    go(async () => { code = await mp.joinRoom(x.c); enterLobby(); });
  });
  el.querySelectorAll('[data-ix]').forEach(b => b.onclick = () => mp.clearInvite(mp.me.uid, b.getAttribute('data-ix')));
}

/* ---------------- voice chat in the room ----------------
   The same voice chat as in the night, so friends can talk while they wait for the host to begin.
   Everyone in the room is connected to everyone else and you hear them straight away; your own mic
   stays off until you press MIC (or M). Voices go straight between browsers (WebRTC); the database
   only carries the connection messages, in the same live/{code}/rtc mailbox the night uses. Lobby
   messages are marked lobby:1 so the night ignores any left over from here, and the lobby ignores the
   night's. If your mic is on when the night begins, the game switches it back on for you. */
const VC = { peers: new Map(), sid: Math.random().toString(36).slice(2, 10), mic: null, on: false, busy: false, code: '',
  unsub: null, tick: 0, lvl: 0, speak: {}, ac: null, meLvl: null };
const ICE = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };
function vcOk() { return !!(window.RTCPeerConnection && navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
/* the VOICE CHAT VOLUME from the game's settings */
function vcVol() {
  try { const v = JSON.parse(localStorage.getItem('hollowmere_settings_v1') || '{}').voiceVol;
    return typeof v === 'number' && isFinite(v) ? Math.max(0, Math.min(1, v)) : 1; } catch (e) { return 1; }
}
function vcAC() {
  if (!VC.ac) { try { VC.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { VC.ac = null; } }
  if (VC.ac && VC.ac.state === 'suspended') VC.ac.resume().catch(() => {});
  return VC.ac;
}
function vcStart(c) {
  if (!vcOk() || !c || VC.code === c) return;
  vcStop(true); VC.code = c;
  mp.clearRtc(c).then(() => { if (VC.code === c) VC.unsub = mp.onRtc(c, m => { vcMsg(m).catch(e => console.warn('Voice:', e)); }); });
  VC.tick = setInterval(vcTick, 1000); VC.lvl = setInterval(vcLevels, 100);
}
/* hang up on everyone; the mic goes off too unless keepMic */
function vcStop(keepMic) {
  clearInterval(VC.tick); clearInterval(VC.lvl); VC.tick = VC.lvl = 0;
  if (VC.unsub) { VC.unsub(); VC.unsub = null; }
  Array.from(VC.peers.keys()).forEach(vcClose); VC.code = '';
  if (!keepMic && VC.mic) { VC.mic.getTracks().forEach(t => t.stop()); VC.mic = null; VC.meLvl = null; VC.on = false; }
}
function vcPeer(uid, initiator) {
  const pc = new RTCPeerConnection(ICE), c = VC.code;
  const p = { uid, pc, initiator, remoteSid: '', pend: [], tr: null, audio: null, an: null, buf: null, badAt: 0 };
  VC.peers.set(uid, p);
  pc.onicecandidate = e => { if (e.candidate) mp.sendRtc(c, uid, { sid: VC.sid, t: 'ice', d: JSON.stringify(e.candidate), lobby: 1 }); };
  pc.ontrack = e => vcAttach(p, (e.streams && e.streams[0]) || new MediaStream([e.track]));
  pc.onconnectionstatechange = () => { const s = pc.connectionState;
    if (s === 'connected') p.badAt = 0;
    else if ((s === 'failed' || s === 'disconnected') && !p.badAt) p.badAt = performance.now(); };
  return p;
}
function vcClose(uid) {
  const p = VC.peers.get(uid); if (!p) return;
  VC.peers.delete(uid);
  try { p.pc.close(); } catch (e) {}
  if (p.audio) { p.audio.srcObject = null; p.audio.remove(); }
  delete VC.speak[uid];
}
const vcTrack = () => VC.on && VC.mic ? VC.mic.getAudioTracks()[0] || null : null;
/* the lower uid of each pair calls, the other answers */
async function vcCall(uid) {
  const p = vcPeer(uid, true), c = VC.code;
  p.tr = p.pc.addTransceiver('audio', { direction: 'sendrecv' });
  await p.tr.sender.replaceTrack(vcTrack());
  await p.pc.setLocalDescription(await p.pc.createOffer());
  mp.sendRtc(c, uid, { sid: VC.sid, t: 'offer', d: p.pc.localDescription.sdp, lobby: 1 });
}
async function vcMsg(m) {
  if (!m.lobby || !VC.code) return;
  const c = VC.code;
  if (m.t === 'offer') {
    vcClose(m.from);
    const p = vcPeer(m.from, false); p.remoteSid = m.sid;
    await p.pc.setRemoteDescription({ type: 'offer', sdp: m.d });
    p.tr = p.pc.getTransceivers()[0];
    if (p.tr) { p.tr.direction = 'sendrecv'; await p.tr.sender.replaceTrack(vcTrack()); }
    await p.pc.setLocalDescription(await p.pc.createAnswer());
    mp.sendRtc(c, m.from, { sid: VC.sid, t: 'answer', d: p.pc.localDescription.sdp, lobby: 1 });
    for (const x of p.pend.splice(0)) await p.pc.addIceCandidate(x).catch(() => {});
    return;
  }
  const p = VC.peers.get(m.from); if (!p) return;
  if (m.t === 'answer') {
    if (!p.initiator || p.pc.signalingState !== 'have-local-offer') return;
    p.remoteSid = m.sid;
    await p.pc.setRemoteDescription({ type: 'answer', sdp: m.d });
    for (const x of p.pend.splice(0)) await p.pc.addIceCandidate(x).catch(() => {});
  } else if (m.t === 'ice') {
    if (p.remoteSid && m.sid !== p.remoteSid) return;          /* from an earlier connection */
    let x; try { x = JSON.parse(m.d); } catch (e) { return; }
    if (!p.pc.remoteDescription) p.pend.push(x); else await p.pc.addIceCandidate(x).catch(() => {});
  }
}
function vcAttach(p, stream) {
  if (!p.audio) { p.audio = document.createElement('audio'); p.audio.autoplay = true; p.audio.style.display = 'none'; document.body.appendChild(p.audio); }
  p.audio.srcObject = stream; p.audio.volume = vcVol();
  p.audio.play().catch(() => {});
  /* how loud they are right now, for the "talking" light */
  try { const ac = vcAC(); if (ac) { const src = ac.createMediaStreamSource(stream); p.an = ac.createAnalyser(); p.an.fftSize = 512; src.connect(p.an); p.buf = new Uint8Array(512); } } catch (e) { p.an = null; }
}
function vcRms(an, buf) { an.getByteTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; s += v * v; } return Math.sqrt(s / buf.length); }
/* once a second: call whoever is new, drop whoever left, retry a broken line */
function vcTick() {
  if (!VC.code || !room) return;
  const now = performance.now(), inRoom = room.players || {};
  Object.keys(inRoom).forEach(uid => {
    if (uid === mp.me.uid) return;
    const p = VC.peers.get(uid);
    if (!p) { if (mp.me.uid < uid) vcCall(uid).catch(e => { console.warn('Voice call:', e); vcClose(uid); }); }
    else if (p.badAt && now - p.badAt > 6000) vcClose(uid);    /* the caller tries again on the next tick */
  });
  Array.from(VC.peers.keys()).forEach(uid => { if (!inRoom[uid]) vcClose(uid); });
}
/* 10 times a second: who is talking */
function vcLevels() {
  const now = performance.now();
  VC.peers.forEach(p => { if (p.an && vcRms(p.an, p.buf) > 0.04) VC.speak[p.uid] = now; });
  if (VC.on && VC.meLvl && vcRms(VC.meLvl.an, VC.meLvl.buf) > 0.04) VC.speak[mp.me.uid] = now;
  document.querySelectorAll('li[data-uid]').forEach(el => el.classList.toggle('talk', now - (VC.speak[el.getAttribute('data-uid')] || 0) < 350));
  const b = document.getElementById('mic'); if (b) b.classList.toggle('talk', now - (VC.speak[mp.me.uid] || 0) < 350);
}
async function vcToggle() {
  if (VC.busy || !VC.code) return;
  VC.busy = true;
  try {
    if (!VC.on) {
      const ac = vcAC();
      try { VC.mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
      catch (e) { setMsg('The mic could not be opened. Allow it for this site in your browser, then try again.'); return; }
      try { if (ac) { const src = ac.createMediaStreamSource(VC.mic), an = ac.createAnalyser(); an.fftSize = 512; src.connect(an); VC.meLvl = { an, buf: new Uint8Array(512) }; } } catch (e) {}
      VC.on = true; setMsg('');
    } else {
      VC.on = false;
      if (VC.mic) VC.mic.getTracks().forEach(t => t.stop());
      VC.mic = null; VC.meLvl = null;
    }
    const tk = vcTrack();
    for (const p of VC.peers.values()) if (p.tr) await p.tr.sender.replaceTrack(tk).catch(() => {});
  } finally {
    VC.busy = false;
    const b = document.getElementById('mic');
    if (b) { b.classList.toggle('on', VC.on); b.textContent = VC.on ? 'MIC ON \u2014 your friends can hear you' : 'MIC OFF \u2014 tap to talk to the room'; }
  }
}
/* browsers only play sound after a tap or key: retry any voice that is waiting */
['click', 'keydown', 'touchend'].forEach(ev => addEventListener(ev, () => {
  if (VC.ac && VC.ac.state === 'suspended') VC.ac.resume().catch(() => {});
  VC.peers.forEach(p => { if (p.audio && p.audio.paused && p.audio.srcObject) p.audio.play().catch(() => {}); });
}, true));
addEventListener('keydown', e => {
  if (e.code === 'KeyM' && !e.repeat && VC.code && !(e.target && e.target.closest && e.target.closest('input,textarea,select'))) { e.preventDefault(); vcToggle(); }
});

function shell(html) { card.innerHTML = html; }
function setMsg(t, ok) { msg = t || ''; msgOk = !!ok; const e = document.getElementById('msg'); if (e) { e.textContent = msg; e.classList.toggle('ok', msgOk); } }

/* ---------------- views ---------------- */
function viewMenu() {
  shell(`
    <p class="note">Friends share one manor. The house grows a floor for every soul that joins, and each soul brings a hunter of its own.</p>
    <div id="invin"></div>
    ${mp.me.account
      ? `<label>YOUR USERNAME</label>
    <input id="name" maxlength="24" value="${esc(mp.me.name)}" readonly style="opacity:.75">
    <p class="note small">This is your account username. It is the name on the leaderboard. Change it from the Account button on the title screen.</p>`
      : `<label>${mp.me.signedIn ? 'GUEST NAME' : 'YOUR NAME (GUEST)'}</label>
    <input id="name" maxlength="24" autocomplete="nickname" value="${esc(mp.me.name)}">
    <p class="note small">${mp.me.signedIn
      ? 'You are signed in but have not chosen a username yet. Open Account on the title screen to pick one, so your name appears on the leaderboard.'
      : 'You are a guest. Guests are temporary \u2014 your name lasts only while this tab is open \u2014 and guests never appear on the leaderboard. Sign in on the title screen to play under your own unique username.'}</p>`}
    <button class="primary" id="create">Make a room</button>
    <div class="or">— OR —</div>
    <label>ROOM CODE</label>
    <input id="code" class="code" maxlength="5" autocomplete="off" spellcheck="false" placeholder="•••••" value="${esc(mp.normCode(qs.get('join')))}">
    <button id="join">Join</button>
    <button id="home">\u2039 Back to the title screen</button>
    <div class="err" id="msg"></div>`);
  document.getElementById('home').onclick = goHome;
  const name = document.getElementById('name'), codeIn = document.getElementById('code');
  const useName = () => { if (!mp.me.account) { const n = name.value.trim(); if (n) mp.saveName(n); } return mp.me.name; };
  document.getElementById('create').onclick = () => go(async () => { useName(); code = await mp.createRoom(); enterLobby(); });
  document.getElementById('join').onclick = () => go(async () => { useName(); code = await mp.joinRoom(codeIn.value); enterLobby(); });
  codeIn.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('join').click(); });
  codeIn.addEventListener('input', () => { codeIn.value = mp.normCode(codeIn.value); });
  if (!msg && !mp.storageOk('sessionStorage')) msg = 'Heads up: this browser is blocking site data for this site. Co-op still works, but reloading the page signs you out. To fix it for good, allow cookies and site data for this site (tap the icon left of the address \u2192 Cookies and site data / Site settings), then reload.';
  renderIncoming();
  setMsg(msg, msgOk);
  if (qs.get('join')) setTimeout(() => codeIn.focus(), 50);
}

async function go(fn) {
  if (busy) return; busy = true;
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  setMsg('');
  try { await fn(); }
  catch (e) { console.warn(e); busy = false; viewMenu(); setMsg(mp.friendlyError(e)); return; }
  busy = false;
}

function viewLobby() {
  if (!room || !room.meta) return;
  const players = Object.entries(room.players || {}).map(([uid, p]) => ({ uid, name: p.name || 'Ghost', t: p.joinedAt || 0 }))
    .sort((a, b) => a.t - b.t || (a.uid < b.uid ? -1 : 1));
  const n = Math.max(1, players.length), amHost = room.meta.host === mp.me.uid;
  const link = location.origin + location.pathname + '?join=' + code;
  shell(`
    <div class="code-cap">ROOM CODE</div>
    <div class="code-big" id="bigcode">${esc(code)}</div>
    <button id="copy">Copy invite link</button>
    <ul>${players.map(p => `<li data-uid="${esc(p.uid)}"><i class="dot"></i><span>${esc(p.name)}${p.uid === mp.me.uid ? ' (you)' : ''}</span>${p.uid === room.meta.host ? '<span class="tag">HOST</span>' : ''}</li>`).join('')}</ul>
    ${vcOk() ? `<button class="mic${VC.on ? ' on' : ''}" id="mic">${VC.on ? 'MIC ON \u2014 your friends can hear you' : 'MIC OFF \u2014 tap to talk to the room'}</button>` : ''}
    <div class="size"><b>${n}</b> ${n === 1 ? 'soul' : 'souls'} → a manor of <b>${mp.floorsFor(n)}</b> floors, <b>${n}</b> ${n === 1 ? 'hunter' : 'hunters'}, <b>${mp.floorsFor(n) * 2}</b> embers to gather.<br>
      <span style="font-size:13px;color:#6f6a5c">Up to ${mp.MAX_PLAYERS} players. Late arrivals can't join once the night begins.</span></div>
    ${amHost ? `<label>DIFFICULTY</label>
    <select id="diff" style="width:100%;padding:10px;margin-bottom:10px;background:#0d0d12;color:#e5dcc2;border:1px solid rgba(160,150,130,.3);font-size:16px">
      ${[['easy','Easy — slower, half-blind'],['normal','Normal'],['hard','Hard — quicker, sharper ears'],['nightmare','Nightmare — the fastest, sharpest hunter']].map(([k,t]) => `<option value="${k}"${k === lobbyDiff ? ' selected' : ''}>${t}</option>`).join('')}
    </select>
    <p class="note small">Each difficulty has its own leaderboard. Co-op never has jumpscares.</p>
    <button class="primary" id="start">Begin the night</button>` : '<p class="note small" style="text-align:center">Waiting for the host to choose the difficulty and begin…</p>'}
    ${mp.me.account ? '<div class="inv" id="inv"></div>' : '<p class="note small">Sign in with a username to invite friends straight into this room. Or send them the code or link.</p>'}
    <div class="row"><button id="leave">Leave room</button><button id="leaveHome">Leave \u2014 title screen</button></div>
    <div class="err" id="msg"></div>`);
  document.getElementById('leaveHome').onclick = goHome;
  renderInv();
  document.getElementById('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(link); setMsg('Link copied — send it to your friends.', true); }
    catch (e) { setMsg(link, true); }
  };
  document.getElementById('leave').onclick = leave;
  const micB = document.getElementById('mic'); if (micB) micB.onclick = vcToggle;
  vcStart(code);
  const dsel = document.getElementById('diff');
  if (dsel) dsel.onchange = () => { lobbyDiff = dsel.value; try { localStorage.setItem('hollowmere_lobby_diff', lobbyDiff); } catch (e) {} };
  const st = document.getElementById('start');
  if (st) st.onclick = async () => {
    st.disabled = true; setMsg('');
    try { await mp.startRoom(code, lobbyDiff); } catch (e) { console.warn(e); st.disabled = false; setMsg(mp.friendlyError(e)); }
  };
  setMsg(msg, msgOk);
}

function enterLobby() {
  if (unsub) unsub();
  history.replaceState(null, '', location.pathname + '?join=' + code);
  unsub = mp.watchRoom(code, async r => {
    if (leaving || launched) return;
    room = r;
    if (!r || !r.meta) { room = null; code = ''; if (unsub) unsub(); vcStop(); viewMenu(); setMsg('That room has closed.'); return; }
    if (!r.players || !r.players[mp.me.uid]) {          /* removed (or never added) */
      if (r.meta.status !== 'lobby') { viewMenu(); setMsg('That night has already begun.'); return; }
      try { await mp.joinRoom(code); } catch (e) { viewMenu(); setMsg(mp.friendlyError(e)); }
      return;
    }
    if (r.meta.status !== 'lobby' && r.meta.config && (r.meta.config.order || []).includes(mp.me.uid)) { launch(); return; }
    viewLobby();
  });
}

async function launch() {
  if (launched) return; launched = true;
  try { if (VC.on) sessionStorage.setItem('hollowmere_mic_on', '1'); } catch (e) {}
  shell('<p class="note" style="text-align:center">The night begins. The house is being built for you…</p>');
  await mp.keepPresence(code);
  (window.hmKeepTab&&window.hmKeepTab()),location.replace('index.html?room=' + code + (qs.get('debug') === '1' ? '&debug=1' : ''));
}

/* back to the game's title screen, leaving the room first if this player is in one */
async function goHome(e) {
  if (e && e.preventDefault) e.preventDefault();
  vcStop();
  if (code && room && !launched) {
    leaving = true; if (unsub) unsub();
    try { await Promise.race([mp.leaveRoom(code), new Promise(r => setTimeout(r, 2000))]); } catch (err) { console.warn(err); }
  }
  (window.hmKeepTab&&window.hmKeepTab()),location.href = 'index.html' + (qs.get('debug') === '1' ? '?debug=1' : '');
}
async function leave() {
  leaving = true; if (unsub) unsub(); vcStop();
  try { await mp.leaveRoom(code); } catch (e) { console.warn(e); }
  leaving = false; code = ''; room = null; history.replaceState(null, '', location.pathname);
  qs.delete('join'); viewMenu();
}

document.getElementById('backLink').onclick = goHome;
/* ---------------- boot ---------------- */
(async () => {
  if (!mp.configured) { shell('<p class="note">Co-op is not switched on for this copy of the game yet.</p><p class="note small">Owner: add the Realtime Database URL to firebase-config.js and publish database.rules.json (see MULTIPLAYER.md).</p>'); return; }
  try { await mp.init(); }
  catch (e) { console.warn(e); shell('<p class="note">' + esc(mp.friendlyError(e)) + '</p>'); return; }
  /* arriving by an invite link for a night this player is already part of drops straight back in */
  const j = mp.normCode(qs.get('join'));
  if (j) {
    try {
      const r = await mp.fetchRoom(j);
      if (r && r.meta && r.meta.status !== 'lobby' && r.meta.config && (r.meta.config.order || []).includes(mp.me.uid)) { code = j; launched = false; launch(); return; }
    } catch (e) { console.warn(e); }
  }
  friendsStart();
  /* from the game's FRIENDS panel: make a room and invite that friend straight away */
  const inv = qs.get('invite');
  if (inv && mp.me.account) {
    history.replaceState(null, '', location.pathname);
    try { code = await mp.createRoom(); await mp.sendInvite(inv, code); FR.sent[inv] = code; msg = 'Invite sent. Waiting for your friend\u2026'; msgOk = true; enterLobby(); return; }
    catch (e) { console.warn(e); viewMenu(); setMsg(mp.friendlyError(e)); return; }
  }
  /* from an invite accepted inside the game: join right away */
  if (j && qs.get('go') === '1') {
    viewMenu();
    go(async () => { code = await mp.joinRoom(j); enterLobby(); });
    return;
  }
  viewMenu();
})();
addEventListener('pagehide', () => { /* the database drops this player from a lobby when the tab closes */ vcStop(); });
</script>
</body>
</html>
