plugins {
    id 'com.android.application'
}

// CI passes -PversionCode=<run number> so every build can install over the last one
def buildNo = (project.findProperty('versionCode') ?: '1').toString()

android {
    namespace 'io.github.anandhavaradhan.hollowmere'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.anandhavaradhan.hollowmere'
        minSdk 21
        targetSdk 35
        versionCode buildNo.toInteger()
        versionName '3.0.' + buildNo
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
