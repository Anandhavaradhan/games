<!DOCTYPE html>
<!--
  HOLLOWMERE MANOR — VAULT OF LEGENDS
  A browser horror-stealth game (three.js). Everything is in this one file except:
    cloud.js            accounts, cloud saves, live status and the leaderboard (Firebase)
    firebase-config.js  which Firebase project to talk to
  Without those two files (or opened straight from disk) the game still runs, as a guest.

  Layout of this file:
    <style>   all CSS (HUD, overlays, vault, account + leaderboard panels)
    <body>    HUD elements, overlays (title / death / win), vault, panels, touch controls
    <script type="module">  the whole game — see the FILE MAP comment at its top
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no">
<title>HOLLOWMERE MANOR — VAULT OF LEGENDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#04050a;font-family:'IM Fell English',serif;color:#cfc8b8;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #fx-vignette{position:absolute;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.55) 82%,rgba(0,0,0,.9) 100%)}
  #fx-danger{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;
    background:radial-gradient(ellipse at center,transparent 30%,rgba(120,4,4,.62) 100%)}
  #fx-flash{position:absolute;inset:0;pointer-events:none;z-index:6;background:#cfd8ff;opacity:0}
  #fx-red{position:absolute;inset:0;pointer-events:none;z-index:7;background:#5a0000;opacity:0;transition:opacity .2s}
  #fx-grain{position:absolute;inset:-100px;pointer-events:none;z-index:8;opacity:.08;background-repeat:repeat;
    animation:grain .45s steps(4) infinite}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-38px,22px)}50%{transform:translate(24px,-30px)}75%{transform:translate(-14px,-18px)}100%{transform:translate(30px,14px)}}
  #jumpscare{position:absolute;inset:0;z-index:17;pointer-events:none;opacity:0;overflow:hidden}
  #jumpscare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    mix-blend-mode:screen;filter:contrast(1.25) saturate(.8)}
  #jumpscare.go{animation:scarePop .95s cubic-bezier(.16,.84,.44,1) forwards}
  @keyframes scarePop{
    0%{opacity:0;transform:scale(1.55)}
    5%{opacity:.92;transform:scale(1.05)}
    9%{opacity:.4;transform:scale(1.12) translateX(-1%)}
    13%{opacity:.88;transform:scale(.99) translateX(1%)}
    45%{opacity:.78;transform:scale(1) translateX(0)}
    78%{opacity:.6;transform:scale(1.03)}
    100%{opacity:0;transform:scale(1.15)}
  }
  #fatal{position:fixed;left:14px;bottom:12px;z-index:60;max-width:70vw;font:12px monospace;color:#ff6a5a;
    background:rgba(10,5,5,.8);border:1px solid #5a2018;padding:8px 12px;opacity:0;transition:opacity .4s;pointer-events:none}
  #hud{position:absolute;inset:0;pointer-events:none;z-index:10}
  #embers{position:absolute;top:18px;left:22px;font-size:22px;letter-spacing:6px;color:#3a3630}
  #embers .lit{color:#ffbe6f;text-shadow:0 0 10px #ff9a2e,0 0 22px rgba(255,140,40,.6)}
  #objective{position:absolute;top:52px;left:22px;font-size:14px;font-style:italic;color:#8f8874;max-width:340px;letter-spacing:.5px}
  #timer{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-family:'IM Fell English',serif;
    font-size:21px;color:#b9b19c;text-shadow:0 2px 10px #000,0 0 14px rgba(80,110,180,.25);white-space:nowrap;
    opacity:0;transition:opacity .4s,color .5s,text-shadow .5s}
  #timer span{display:inline-block;width:.56em;text-align:center}
  #timer span.sep{width:.28em}
  #timer .tenth{font-size:.72em;color:#7d7663}
  #timer.on{opacity:1}
  #timer.paused{opacity:.4}
  #timer.hunt{color:#ff6a52;text-shadow:0 2px 10px #000,0 0 16px rgba(255,40,20,.55)}
  #floorlabel{position:absolute;top:18px;right:24px;font-family:'Cinzel Decorative',serif;font-size:15px;letter-spacing:3px;color:#6f7a92;text-shadow:0 0 12px rgba(80,110,180,.4)}
  #esswrap{position:absolute;left:22px;bottom:26px;width:210px}
  #esslabel{font-size:11px;letter-spacing:4px;color:#5f6c85;margin-bottom:4px}
  #essbar{width:100%;height:7px;background:#10131c;border:1px solid #2a3040}
  #essfill{height:100%;width:100%;background:linear-gradient(90deg,#33507a,#9fc4ff);box-shadow:0 0 10px rgba(140,180,255,.5);transition:width .12s,background .3s,box-shadow .3s}
  #essfill.low{background:linear-gradient(90deg,#7a2a2a,#ff8f6f);box-shadow:0 0 12px rgba(255,110,80,.65);animation:essPulse .9s ease-in-out infinite}
  @keyframes essPulse{0%,100%{opacity:1}50%{opacity:.55}}
  #toast{position:absolute;top:14%;left:50%;transform:translateX(-50%);font-family:'Cinzel Decorative',serif;
    font-size:19px;letter-spacing:4px;color:#d8d2be;text-shadow:0 0 18px rgba(255,190,110,.35);opacity:0;transition:opacity .5s;text-align:center;white-space:nowrap}
  #subtitle{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);font-style:italic;font-size:17px;color:#9a927e;opacity:0;transition:opacity .8s;text-shadow:0 2px 8px #000}
  #hidePrompt{position:absolute;bottom:17%;left:50%;transform:translateX(-50%);font-family:'Cinzel Decorative',serif;
    font-size:13px;letter-spacing:3px;color:#bfead0;text-shadow:0 0 10px rgba(120,220,150,.55);opacity:0;
    transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #hidePrompt.on{opacity:1}
  #seen{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-family:'Cinzel Decorative',serif;font-size:34px;
    letter-spacing:10px;color:#ff2a1a;text-shadow:0 0 24px rgba(255,30,10,.8);opacity:0}
  #seen.on{animation:seenA 1s ease-out}
  @keyframes seenA{0%{opacity:0;transform:translateX(-50%) scale(1.5)}12%{opacity:1;transform:translateX(-50%) scale(1)}70%{opacity:1}100%{opacity:0}}
  #gearBtn{position:absolute;top:52px;right:18px;z-index:15;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    border:1px solid #3a3630;background:rgba(8,9,14,.55);color:#9a927e;font-size:19px;cursor:pointer;pointer-events:auto}
  #gearBtn:hover{color:#d8cfb6;border-color:#6a5a42}
  body.title #gearBtn{animation:pulse 2.1s ease-in-out infinite}
  #setPanel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:26;width:min(380px,90vw);
    max-height:88vh;overflow-y:auto;background:rgba(6,7,12,.95);border:1px solid #3a3630;padding:22px 26px;text-align:left;display:none}
  #setPanel h3{font-family:'Cinzel Decorative',serif;letter-spacing:4px;font-size:17px;color:#d8cfb6;margin-bottom:16px;text-align:center}
  .srow{margin:15px 0}
  .slab{display:flex;justify-content:space-between;font-size:13px;letter-spacing:2px;color:#8f8874;margin-bottom:7px}
  .slab .sv{color:#cfc8b8}
  input[type=range]{width:100%;accent-color:#9fc4ff;height:22px}
  #invertBtn,#flashBtn{width:100%;padding:10px 12px;border:1px solid #3a3630;background:rgba(15,17,26,.7);color:#cfc8b8;
    font-family:'IM Fell English',serif;font-size:14px;letter-spacing:1px;cursor:pointer;text-align:center}
  #setClose{margin-top:18px;width:100%;padding:11px;border:1px solid #4a4436;background:rgba(20,18,14,.7);
    color:#e5dcc2;font-family:'Cinzel Decorative',serif;font-size:14px;letter-spacing:4px;cursor:pointer;text-align:center}
  #setClose:hover{border-color:#8a7f60}
  /* ===== ACCOUNT PANEL ===== */
  #acctPanel,#lbPanel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:27;width:min(400px,92vw);
    max-height:90vh;overflow-y:auto;background:#06070c;border:1px solid #3a3630;padding:22px 26px;text-align:left;display:none;
    box-shadow:0 30px 80px rgba(0,0,0,.8)}
  #acctScrim{position:absolute;inset:0;z-index:26;background:rgba(3,4,8,.82);display:none}
  #acctPanel h3,#lbPanel h3{font-family:'Cinzel Decorative',serif;letter-spacing:4px;font-size:17px;color:#d8cfb6;margin-bottom:14px;text-align:center}
  .acnote{font-size:14px;line-height:1.55;color:#a89f8a;font-style:italic}
  .acbtn{display:block;width:100%;margin-top:12px;padding:11px 12px;border:1px solid #3a3630;background:rgba(15,17,26,.8);color:#e5dcc2;
    font-family:'IM Fell English',serif;font-size:15px;letter-spacing:1px;cursor:pointer;text-align:center}
  .acbtn:hover,.acbtn:focus-visible{border-color:#8a7f60;color:#fff;outline:none}
  .acbtn.primary{border-color:#8a7f60;background:rgba(40,32,20,.8)}
  .acbtn[disabled]{opacity:.5;cursor:default}
  .acin{display:block;width:100%;margin-top:9px;padding:10px 12px;background:rgba(15,17,26,.9);border:1px solid #3a3630;color:#e5dcc2;
    font-family:'IM Fell English',serif;font-size:16px;-webkit-user-select:text;user-select:text;border-radius:0;outline:none}
  .acin:focus{border-color:#9fc4ff}
  .acin::placeholder{color:#5f6c85}
  .actabs{display:flex;margin-top:16px;border-bottom:1px solid #2a2620}
  .actab{flex:1;padding:8px;text-align:center;font-size:13px;letter-spacing:2px;color:#6f6a5c;cursor:pointer;border-bottom:2px solid transparent}
  .actab.on{color:#ffbe6f;border-bottom-color:#ffbe6f}
  .acor{margin-top:16px;text-align:center;font-size:12px;letter-spacing:2px;color:#5f6c85}
  .acerr{min-height:18px;margin-top:10px;font-size:13px;line-height:1.4;color:#ff8f6f}
  .acerr.ok{color:#bfead0}
  .aclink{display:inline-block;margin-top:10px;font-size:13px;color:#8f8874;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .acwho{font-size:18px;color:#ffbe6f}
  .acmail{font-size:13px;color:#6f7a92;margin-top:2px}
  .acstats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:14px}
  .acstats div{font-size:12px;letter-spacing:1px;color:#6f6a5c}
  .acstats b{display:block;font-weight:normal;font-size:17px;color:#d8cfb6;letter-spacing:0}
  .acsync{margin-top:12px;font-size:12px;color:#6f7a92;font-style:italic}
  .acsync.bad{color:#ff8f6f}
  #acctClose,#lbClose{margin-top:16px;width:100%;padding:11px;border:1px solid #4a4436;background:rgba(20,18,14,.7);
    color:#e5dcc2;font-family:'Cinzel Decorative',serif;font-size:14px;letter-spacing:4px;cursor:pointer;text-align:center}
  .acctline{margin-top:14px;font-size:14px;color:#8f8874;font-style:italic;letter-spacing:1px}
  .acctline b{font-weight:normal;color:#ffbe6f;font-style:normal}
  /* ===== LEADERBOARD PANEL (fastest escapes) ===== */
  #lbPanel{width:min(480px,94vw)}
  .lbsub{font-size:14px;line-height:1.5;color:#8f8874;font-style:italic;text-align:center;margin:-4px 0 12px}
  #lbList{max-height:50vh;overflow-y:auto;border-top:1px solid rgba(160,150,130,.14)}
  .lbrow{display:grid;grid-template-columns:2em 1fr auto;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid rgba(160,150,130,.12)}
  .lbrank{font-family:'Cinzel Decorative',serif;font-size:14px;color:#6f7a92;text-align:right}
  .lbrow.r1 .lbrank{color:#ffd27a}.lbrow.r2 .lbrank{color:#d8dde6}.lbrow.r3 .lbrank{color:#d39a6a}
  .lbname{min-width:0;font-size:17px;color:#e5dcc2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lbmeta{display:block;font-size:12px;color:#6f6a5c;margin-top:1px}
  .lbdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .lbtime{font-size:19px;color:#ffbe6f;font-variant-numeric:tabular-nums}
  .lbrow.me{background:rgba(255,190,111,.07)}
  .lbrow.me .lbname{color:#ffbe6f}
  .lbmine{margin-top:14px;font-size:15px;color:#a89f8a;font-style:italic;text-align:center}
  #touchUI{display:none;position:absolute;inset:0;z-index:12;pointer-events:none}
  body.touch #touchUI{display:block}
  #zoneL{position:absolute;left:0;top:0;width:50%;height:100%;pointer-events:auto;touch-action:none}
  #zoneR{position:absolute;right:0;top:0;width:50%;height:100%;pointer-events:auto;touch-action:none}
  #stickBase{display:none;position:absolute;width:112px;height:112px;border-radius:50%;z-index:13;pointer-events:none;
    border:2px solid rgba(180,200,255,.35);background:rgba(20,30,50,.25)}
  #stickKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:rgba(160,190,255,.5);box-shadow:0 0 12px rgba(140,180,255,.4)}
  #tbtns{position:absolute;right:14px;bottom:20px;display:flex;align-items:flex-end;gap:12px;z-index:14;pointer-events:none}
  .tbtn{pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid rgba(200,190,160,.4);
    background:rgba(15,15,22,.55);color:#cfc8b8;display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel Decorative',serif;letter-spacing:1px;width:70px;height:70px;font-size:11px}
  .tbtn.big{width:92px;height:92px;font-size:13px}
  .tbtn.small{width:54px;height:54px;font-size:9px}
  .tbtn:active{background:rgba(70,70,95,.65)}
  .overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(6,8,14,.55) 0%,rgba(3,4,8,.92) 78%);text-align:center;padding:20px;cursor:pointer}
  .hidden{display:none!important}
  .overlay h1{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(38px,7vw,74px);letter-spacing:10px;color:#d9d2bd;
    text-shadow:0 0 30px rgba(150,40,30,.55),0 0 70px rgba(90,20,20,.5);animation:flick 5s infinite}
  @keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
  .overlay h2{font-family:'Cinzel Decorative',serif;font-size:clamp(13px,2vw,18px);letter-spacing:6px;color:#8a4a42;margin-top:10px}
  .overlay p{max-width:640px;font-size:17px;line-height:1.65;color:#a89f8a;margin-top:22px;font-style:italic}
  .controls{margin-top:22px;border:1px solid #3a3630;padding:16px 30px;font-size:15px;color:#9a927e;line-height:2;letter-spacing:1px;background:rgba(8,9,14,.55)}
  .controls b{color:#d8cfb6;font-weight:normal;letter-spacing:2px}
  .ovbtn{margin-top:22px;border:1px solid #3a3630;padding:10px 28px;font-family:'Cinzel Decorative',serif;font-size:14px;
    letter-spacing:4px;color:#cfc8b8;background:rgba(8,9,14,.55);cursor:pointer;pointer-events:auto}
  .ovbtn:hover{color:#fff;border-color:#8a7f60}
  .pulse{margin-top:22px;font-family:'Cinzel Decorative',serif;font-size:17px;letter-spacing:5px;color:#e5dcc2;animation:pulse 2.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;text-shadow:0 0 6px rgba(255,200,120,.2)}50%{opacity:1;text-shadow:0 0 20px rgba(255,200,120,.7)}}
  .stat{font-size:16px;color:#8f8874;margin-top:8px;letter-spacing:2px}
  #deathOv h1{color:#c22a1c;text-shadow:0 0 40px rgba(255,40,20,.6)}
  /* ===== LEGEND / ABILITY HUD ===== */
  :root{--vt:#ffbe6f}
  #abhud{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;
    gap:12px;text-align:left;pointer-events:none;transition:opacity .3s}
  #ablegend{font-family:'Cinzel Decorative',serif;font-size:11px;letter-spacing:4px;color:#8f8874}
  #abname{font-size:14px;letter-spacing:3px;color:var(--vt);margin-top:3px;text-shadow:0 0 14px rgba(0,0,0,.9)}
  #abstate{font-size:10px;letter-spacing:3px;color:#6f7a92;margin-top:3px}
  #abhud.ready #abstate{color:var(--vt)}
  #abtags{font-size:10px;letter-spacing:2px;color:#9fc4ff;margin-top:3px;min-height:13px;
    text-shadow:0 0 10px rgba(140,180,255,.5)}
  #abtext{min-width:150px}

  /* ===== ABILITY INDICATOR: outline, sweep, aura ===== */
  #abicon,#btnPower{position:relative}
  #abicon{width:54px;height:54px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  #abname,#ablegend{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #abinitial{font-family:'Cinzel Decorative',serif;font-size:19px;color:var(--vt);letter-spacing:0;
    text-shadow:0 0 12px var(--vt)}
  #abicon .ringsvg,#btnPower .ringsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
    pointer-events:none;transform:rotate(-90deg)}
  .ringbg{fill:none;stroke:rgba(200,190,160,.13);stroke-width:4}
  .ring{fill:none;stroke:var(--vt);stroke-width:4;stroke-linecap:butt;
    stroke-dasharray:289.03;stroke-dashoffset:0;
    transition:stroke-dashoffset .2s linear,opacity .25s;
    filter:drop-shadow(0 0 6px var(--vt))}
  .aura{position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--vt);opacity:0;pointer-events:none}
  @keyframes auraShrink{0%{transform:scale(1.9);opacity:0}16%{opacity:.62}100%{transform:scale(.97);opacity:0}}
  @keyframes ringReady{0%,100%{filter:drop-shadow(0 0 5px var(--vt))}
    50%{filter:drop-shadow(0 0 14px var(--vt))}}
  .abx.ready .ring{animation:ringReady 2.6s ease-in-out infinite}
  .abx.active .ring{opacity:0}
  .abx.active .aura{animation:auraShrink 1.6s ease-out infinite}
  .abx.active .aura.a2{animation-delay:.8s}
  .abx.cool .ring{filter:none}
  .abx.nofuel .ring{opacity:.32;filter:none}
  .abx.spent .ring{stroke:#6f6a5c;filter:none;opacity:.5}
  .abx.spent #abinitial,.abx.spent #pwrlabel{opacity:.4}
  .abx.cool #pwrlabel{opacity:.55}
  #btnHide{display:none}
  #tbtns{flex-direction:column;align-items:flex-end;gap:10px}
  .trow{display:flex;align-items:flex-end;gap:10px;pointer-events:none}
  .tbtn.pwr{width:64px;height:64px;font-size:9px;border-color:transparent;color:var(--vt);letter-spacing:0}
  #pwrlabel{position:relative;z-index:1;padding:0 4px;text-align:center;line-height:1.1}

  /* =========================================================
     THE VAULT — rebuilt as a gallery of ghosts.
     Cards you can read at a glance; one dossier that explains
     the ability in plain words before it gets poetic.
     ========================================================= */
  #vaultOv{position:absolute;inset:0;z-index:24;display:flex;flex-direction:column;
    background:radial-gradient(ellipse at 62% 46%,rgba(3,4,8,.42) 0%,rgba(3,4,8,.93) 72%)}
  #vaultOv.hidden{display:none!important}

  #vHead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 20px;
    border-bottom:1px solid #2a2620;background:rgba(4,5,10,.78)}
  #vTitle{font-family:'Cinzel Decorative',serif;font-size:16px;letter-spacing:6px;color:#d8cfb6;
    animation:flick 7s infinite}
  #vWallet{margin-left:auto;font-size:12px;letter-spacing:3px;color:#8f8874;white-space:nowrap}
  #vWallet b{color:#ffbe6f;font-weight:normal;text-shadow:0 0 14px rgba(255,170,80,.6)}
  #vClose{border:1px solid #4a4436;padding:8px 18px;font-family:'Cinzel Decorative',serif;font-size:12px;
    letter-spacing:4px;color:#e5dcc2;background:rgba(20,18,14,.7);cursor:pointer}
  #vClose:hover{border-color:#8a7f60;color:#fff}

  #vFilters{display:flex;gap:7px;flex-wrap:wrap;padding:10px 20px 0;position:relative;z-index:2}
  .vchip{border:1px solid #33302a;background:rgba(10,12,18,.66);color:#8f8874;cursor:pointer;
    font-family:'IM Fell English',serif;font-size:11px;letter-spacing:2px;padding:6px 12px}
  .vchip:hover{border-color:#8a7f60;color:#d8cfb6}
  .vchip.on{border-color:#ffbe6f;color:#ffbe6f;background:rgba(60,44,20,.5)}
  .vchip i{font-style:normal;opacity:.5;margin-left:6px}

  #vBody{flex:1;min-height:0;display:flex;gap:16px;padding:12px 20px 14px;position:relative;z-index:2}
  /* min-content rows: the cards clip their own glow with overflow:hidden, and a
     stretched row then mis-measures their height */
  #vGrid{flex:1;min-width:0;overflow-y:auto;align-content:start;grid-auto-rows:min-content;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:9px;padding-right:4px}
  #vGrid::-webkit-scrollbar{width:4px}#vGrid::-webkit-scrollbar-thumb{background:#3a3630}

  /* --- a ghost card --- */
  .vcard{position:relative;text-align:left;cursor:pointer;overflow:hidden;padding:9px 9px 8px;min-height:104px;

  #musicBtn{width:100%;padding:10px 12px;border:1px solid #3a3630;background:rgba(15,17,26,.7);color:#cfc8b8;

  #vaultOv::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;

<body>
<div id="hmSplash" role="dialog" aria-modal="true" aria-labelledby="hmSplashTitle">
  <div id="hmSplashCard">
    <div id="hmSplashKicker">AN UPDATE HAS ARRIVED</div>
    <h1 id="hmSplashTitle">HOLLOWMERE V2<br>HAS BEEN LAUNCHED</h1>
    <p>A new build of the house is open. Go there to continue your haunting:</p>
    <a id="hmSplashLink" href="https://anandhavaradhan.github.io/games/hollowmere-v2/" target="_blank" rel="noopener">https://anandhavaradhan.github.io/games/hollowmere-v2/</a>
    <div id="hmSplashBtns">
      <button id="hmSplashGo" class="ovbtn">GO TO HOLLOWMERE V2</button>
      <button id="hmSplashStay" class="ovbtn">CONTINUE PLAYING HOLLOWMERE (V1)</button>
    </div>
  </div>
</div>
<script>
(function(){
  var splash=document.getElementById('hmSplash');
  var stay=document.getElementById('hmSplashStay');
  var go=document.getElementById('hmSplashGo');
  var V2_URL='https://anandhavaradhan.github.io/games/hollowmere-v2/';
  function isOpen(){return splash&&!splash.classList.contains('hidden');}
  function dismiss(){splash.classList.add('hidden');}
  /* keep every click/tap on the splash from reaching the v1 title screen's
     document-level "advance()" listener underneath */
  splash.addEventListener('click',function(e){e.stopPropagation();});
  splash.addEventListener('contextmenu',function(e){e.stopPropagation();});
  /* keydown/keyup aren't blocked by z-index stacking (no hit-testing involved),
     so intercept them in the capture phase, ahead of the game's own window
     listener, while the splash is showing */
  window.addEventListener('keydown',function(e){if(isOpen())e.stopPropagation();},true);
  window.addEventListener('keyup',function(e){if(isOpen())e.stopPropagation();},true);
  stay.addEventListener('click',function(e){e.stopPropagation();dismiss();});
  go.addEventListener('click',function(e){e.stopPropagation();window.location.href=V2_URL;});
})();
</script>
<div id="wrap">
